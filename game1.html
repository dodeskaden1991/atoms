<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sumo Bumpers Arena - Realtime</title>

  <!-- Firebase SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #050508;
      color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    /* UI HUD */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
    }
    .hud-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: auto;
    }
    .exit-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s;
    }
    .exit-btn:hover {
      background: rgba(239, 68, 68, 0.4);
      color: #fff;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .leaderboard {
      min-width: 130px;
      max-width: 160px;
      font-size: 11px;
    }
    .leaderboard h3 {
      font-size: 10px;
      color: #f59e0b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .lb-row.me { color: #38bdf8; font-weight: bold; }

    /* Controls */
    #touch-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      height: 110px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      z-index: 50;
    }
    .joystick-zone {
      width: 95px;
      height: 95px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      position: relative;
      pointer-events: auto;
      opacity: 0.75;
    }
    .joystick-knob {
      width: 36px;
      height: 36px;
      background: rgba(56, 189, 248, 0.65);
      border: 2px solid #38bdf8;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .boost-button {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(245,158,11,0.8) 0%, rgba(180,83,9,0.8) 100%);
      border: 2px solid #fbbf24;
      border-radius: 50%;
      pointer-events: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      opacity: 0.85;
    }
    .boost-button:active {
      transform: scale(0.92);
      opacity: 1;
    }

    /* Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 5, 8, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      text-align: center;
      padding: 20px;
    }
    .overlay h1 {
      font-size: 32px;
      color: #f59e0b;
      margin-bottom: 8px;
    }
    .overlay p {
      color: #94a3b8;
      max-width: 450px;
      margin-bottom: 18px;
      font-size: 14px;
    }
    .input-group input {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
      outline: none;
      margin-bottom: 18px;
    }
    .btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-container">
  <div class="hud-top">
    <div class="hud-controls">
      <button class="exit-btn" onclick="exitGame()">🚪 Изход</button>
      <div class="hud-card">
        <div style="color: #94a3b8;">Умирания: <span id="my-deaths" style="color:#ef4444; font-weight:bold;">0 💀</span></div>
      </div>
    </div>

    <div class="hud-card leaderboard">
      <h3>Топ (Най-малко Умирания)</h3>
      <div id="lb-list"></div>
    </div>
  </div>

  <div id="touch-controls">
    <div id="move-joystick" class="joystick-zone">
      <div id="move-knob" class="joystick-knob"></div>
    </div>

    <div id="boost-btn" class="boost-button">NITRO</div>
  </div>
</div>

<div id="start-overlay" class="overlay">
  <h1>SUMO BUMPERS 🏎️💥</h1>
  <p>Оцелей на платформата! Всеки път щом паднеш в лавата, трупаш негативен точков индекс (падания).</p>
  
  <div class="input-group">
    <input type="text" id="player-name" placeholder="Твоето Име..." maxlength="10" value="Bumper">
  </div>

  <button class="btn" onclick="joinGame()">ВЛЕЗ В АРЕНАТА</button>
</div>

<div id="respawn-overlay" class="overlay hidden">
  <h1 style="color: #ef4444;">ИЗХВЪРЧЯ В ЛАВАТА! 🔥</h1>
  <p>Връщане на арената след секунда...</p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAGF9BsM0_OMADMYiTIpIFQ3rlWPQIcP-M",
  authDomain: "atoms-32b0d.firebaseapp.com",
  databaseURL: "https://atoms-32b0d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "atoms-32b0d",
  storageBucket: "atoms-32b0d.appspot.com",
  messagingSenderId: "358321648052",
  appId: "1:358321648052:web:2f58f230f8b1384121c2e1",
  measurementId: "G-MFJNLQMEH2"
};

firebase.initializeApp(firebaseConfig);
window.db = firebase.database();

const myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let windowWidth = window.innerWidth;
let windowHeight = window.innerHeight;

function resizeCanvas() {
  windowWidth = window.innerWidth;
  windowHeight = window.innerHeight;
  canvas.width = windowWidth;
  canvas.height = windowHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let arenaRadius = 600;

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

const touchControls = { dx: 0, dy: 0, active: false, boost: false };

const zone = document.getElementById('move-joystick');
const knob = document.getElementById('move-knob');
let touchId = null;

zone.addEventListener('touchstart', e => {
  e.preventDefault();
  if (touchId !== null) return;
  const touch = e.changedTouches[0];
  touchId = touch.identifier;
  updateKnob(touch);
});

window.addEventListener('touchmove', e => {
  if (touchId === null) return;
  for (let t of e.changedTouches) {
    if (t.identifier === touchId) { updateKnob(t); break; }
  }
});

const resetJoystick = (e) => {
  if (touchId === null) return;
  for (let t of e.changedTouches) {
    if (t.identifier === touchId) {
      touchId = null;
      knob.style.transform = `translate(-50%, -50%)`;
      touchControls.dx = 0; touchControls.dy = 0; touchControls.active = false;
      break;
    }
  }
};
window.addEventListener('touchend', resetJoystick);
window.addEventListener('touchcancel', resetJoystick);

function updateKnob(touch) {
  const rect = zone.getBoundingClientRect();
  let dx = touch.clientX - (rect.left + rect.width / 2);
  let dy = touch.clientY - (rect.top + rect.height / 2);
  const dist = Math.hypot(dx, dy);
  const maxR = rect.width / 2;

  if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  touchControls.dx = dx / maxR;
  touchControls.dy = dy / maxR;
  touchControls.active = true;
}

const boostBtn = document.getElementById('boost-btn');
boostBtn.addEventListener('touchstart', e => { e.preventDefault(); touchControls.boost = true; });
boostBtn.addEventListener('touchend', e => { e.preventDefault(); touchControls.boost = false; });
boostBtn.addEventListener('touchcancel', e => { e.preventDefault(); touchControls.boost = false; });

let localPlayer = null;
let networkPlayers = {};
let particles = [];
let isPlaying = false;
let myDeaths = 0; // Нашите умирания

class BumperCar {
  constructor(id, x, y, name, color) {
    this.id = id;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.radius = 28;
    this.angle = 0;
    this.name = name;
    this.color = color;
    this.deaths = myDeaths;

    this.boostCooldown = 0;
  }

  update() {
    let moveX = 0, moveY = 0;

    if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

    if (touchControls.active) {
      moveX = touchControls.dx;
      moveY = touchControls.dy;
    }

    if (moveX !== 0 || moveY !== 0) {
      const len = Math.hypot(moveX, moveY);
      const accel = 0.55;
      this.vx += (moveX / (len > 1 ? len : 1)) * accel;
      this.vy += (moveY / (len > 1 ? len : 1)) * accel;
      this.angle = Math.atan2(this.vy, this.vx);
    }

    if ((keys['Space'] || touchControls.boost) && this.boostCooldown <= 0) {
      this.boostCooldown = 90;
      const boostForce = 14;
      this.vx += Math.cos(this.angle) * boostForce;
      this.vy += Math.sin(this.angle) * boostForce;

      for(let i=0; i<15; i++) {
        particles.push({
          x: this.x, y: this.y,
          vx: -Math.cos(this.angle)*rand(3,8) + rand(-2,2),
          vy: -Math.sin(this.angle)*rand(3,8) + rand(-2,2),
          life: 20, color: '#f59e0b'
        });
      }
    }

    if (this.boostCooldown > 0) this.boostCooldown--;

    this.vx *= 0.94;
    this.vy *= 0.94;

    this.x += this.vx;
    this.y += this.vy;
  }

  draw(ctx, camX, camY) {
    ctx.save();
    ctx.translate(this.x - camX, this.y - camY);

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = this.color;
    ctx.stroke();

    ctx.rotate(this.angle);
    ctx.fillStyle = this.color;
    ctx.fillRect(-12, -10, 24, 20);

    ctx.fillStyle = '#fff';
    ctx.fillRect(8, -8, 5, 4);
    ctx.fillRect(8, 4, 5, 4);

    ctx.restore();

    ctx.save();
    ctx.translate(this.x - camX, this.y - camY);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`${this.name} (${this.deaths}💀)`, 0, -this.radius - 8);
    ctx.restore();
  }
}

function rand(min, max) { return Math.random() * (max - min) + min; }

function setupNetwork() {
  window.db.ref('bumper_game/players').on('value', snapshot => {
    const data = snapshot.val() || {};
    networkPlayers = {};
    for (let id in data) {
      if (id !== myPlayerId) networkPlayers[id] = data[id];
    }
  });
}

function syncPosition() {
  if (!localPlayer) return;
  window.db.ref('bumper_game/players/' + myPlayerId).set({
    id: localPlayer.id,
    x: localPlayer.x,
    y: localPlayer.y,
    angle: localPlayer.angle,
    name: localPlayer.name,
    color: localPlayer.color,
    deaths: myDeaths,
    lastSeen: Date.now()
  });
}

function checkCollisions() {
  if (!localPlayer) return;

  for (let id in networkPlayers) {
    let p = networkPlayers[id];
    let dist = Math.hypot(localPlayer.x - p.x, localPlayer.y - p.y);
    let minDist = localPlayer.radius + 28;

    if (dist < minDist) {
      let angle = Math.atan2(localPlayer.y - p.y, localPlayer.x - p.x);
      let pushForce = 4.5 + Math.hypot(localPlayer.vx, localPlayer.vy);
      localPlayer.vx += Math.cos(angle) * pushForce;
      localPlayer.vy += Math.sin(angle) * pushForce;
    }
  }
}

function gameLoop() {
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, windowWidth, windowHeight);

  if (localPlayer) {
    localPlayer.update();
    checkCollisions();

    let distFromCenter = Math.hypot(localPlayer.x, localPlayer.y);
    if (distFromCenter > arenaRadius) {
      myDeaths++; // Паднали сме, добавяме +1 умиране
      triggerFall();
    }

    syncPosition();
  }

  ctx.save();
  let zoom = 1;
  if (windowWidth < 768) {
    zoom = 0.65;
    ctx.scale(zoom, zoom);
    ctx.translate((windowWidth * (1 - zoom)) / (2 * zoom), (windowHeight * (1 - zoom)) / (2 * zoom));
  }

  const camX = localPlayer ? localPlayer.x - windowWidth / 2 : 0;
  const camY = localPlayer ? localPlayer.y - windowHeight / 2 : 0;

  ctx.fillStyle = '#991b1b';
  ctx.fillRect(-windowWidth * 2, -windowHeight * 2, windowWidth * 5, windowHeight * 5);

  ctx.save();
  ctx.beginPath();
  ctx.arc(-camX, -camY, arenaRadius, 0, Math.PI * 2);
  ctx.fillStyle = '#0f172a';
  ctx.fill();
  ctx.lineWidth = 12;
  ctx.strokeStyle = '#f59e0b';
  ctx.stroke();
  ctx.restore();

  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x - camX, p.y - camY, 3, 0, Math.PI*2); ctx.fill();
    if(p.life <= 0) particles.splice(i, 1);
  }

  if (localPlayer) localPlayer.draw(ctx, camX, camY);

  const now = Date.now();
  for (let id in networkPlayers) {
    let p = networkPlayers[id];

    if (!p.lastSeen || (now - p.lastSeen > 5000)) {
      delete networkPlayers[id];
      window.db.ref('bumper_game/players/' + id).remove();
      continue;
    }

    let remoteCar = new BumperCar(p.id, p.x, p.y, p.name, p.color);
    remoteCar.angle = p.angle;
    remoteCar.deaths = p.deaths || 0;
    remoteCar.draw(ctx, camX, camY);
  }

  ctx.restore();

  updateHUD();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('my-deaths').textContent = `${myDeaths} 💀`;

  const allList = [];
  if (localPlayer) allList.push({ id: myPlayerId, name: localPlayer.name, deaths: myDeaths });
  for (let id in networkPlayers) {
    allList.push({ id: id, name: networkPlayers[id].name, deaths: networkPlayers[id].deaths || 0 });
  }

  // Сортиране ПО ВЪЗХОДЯЩ РЕД (Най-малко умирания е най-горе)
  const sorted = allList.sort((a, b) => a.deaths - b.deaths).slice(0, 5);
  const lbContainer = document.getElementById('lb-list');
  lbContainer.innerHTML = '';

  sorted.forEach((t, idx) => {
    const row = document.createElement('div');
    row.className = `lb-row ${t.id === myPlayerId ? 'me' : ''}`;
    row.innerHTML = `<span>#${idx+1} ${t.name}</span><span>${t.deaths} 💀</span>`;
    lbContainer.appendChild(row);
  });
}

function joinGame() {
  const name = document.getElementById('player-name').value.trim() || "Bumper";
  document.getElementById('start-overlay').classList.add('hidden');

  const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
  localPlayer = new BumperCar(myPlayerId, rand(-150, 150), rand(-150, 150), name, randomColor);

  window.db.ref('bumper_game/players/' + myPlayerId).onDisconnect().remove();

  setupNetwork();

  if (!isPlaying) {
    isPlaying = true;
    gameLoop();
  }
}

function triggerFall() {
  window.db.ref('bumper_game/players/' + myPlayerId).remove();
  localPlayer = null;

  document.getElementById('respawn-overlay').classList.remove('hidden');

  setTimeout(() => {
    document.getElementById('respawn-overlay').classList.add('hidden');
    joinGame();
  }, 1500);
}

function exitGame() {
  if (myPlayerId) {
    window.db.ref('bumper_game/players/' + myPlayerId).remove();
  }
  window.location.href = 'index.html';
}
</script>
</body>
</html>
