    // РЕНДЕР 1: МОДЕРЕН ВЕРТИКАЛЕН СТОРИ СТИЛ (1080x1920)
    function generateStoryCanvasCard(textToDraw, styleIdx, dateStr) {
      const activeStyle = storyStyles[styleIdx] || storyStyles[0];
      
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 1080; canvas.height = 1920;

      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, activeStyle.bgGradient[0]);
      bgGrad.addColorStop(0.5, activeStyle.bgGradient[1]);
      if (activeStyle.bgGradient[2]) {
        bgGrad.addColorStop(1, activeStyle.bgGradient[2]);
      } else {
        bgGrad.addColorStop(1, activeStyle.bgGradient[1]);
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.015)";
      for (let i = 0; i < 80000; i++) {
        const rx = Math.random() * canvas.width;
        const ry = Math.random() * canvas.height;
        ctx.fillRect(rx, ry, 2, 2);
      }

      if (activeStyle.decorations === "circle") {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 400, 0, Math.PI * 2); ctx.stroke();
      } else if (activeStyle.decorations === "cross") {
        ctx.strokeStyle = activeStyle.accentColor; ctx.lineWidth = 2;
        const offset = 100;
        ctx.beginPath(); ctx.moveTo(offset, offset); ctx.lineTo(offset + 20, offset); ctx.moveTo(offset, offset); ctx.lineTo(offset, offset + 20);
        ctx.moveTo(canvas.width - offset, offset); ctx.lineTo(canvas.width - offset - 20, offset); ctx.moveTo(canvas.width - offset, offset); ctx.lineTo(canvas.width - offset, offset + 20);
        ctx.stroke();
      } else if (activeStyle.decorations === "lines") {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)"; ctx.lineWidth = 1;
        for (let l = 200; l < canvas.width; l += 200) {
          ctx.beginPath(); ctx.moveTo(l, 0); ctx.lineTo(l, canvas.height); ctx.stroke();
        }
      }

      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.strokeStyle = activeStyle.borderColor;
      ctx.lineWidth = 2;
      const boxX = 100; const boxY = 450; const boxW = canvas.width - 200; const boxH = 950;
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = activeStyle.textColor;
      ctx.font = `bold 32px ${activeStyle.fontFamily}`;
      ctx.fillText("▲ ATMOS ENGINE // DISCOVERED", canvas.width / 2, 250);

      ctx.fillStyle = activeStyle.subTextColor;
      ctx.font = `18px monospace`;
      ctx.fillText(`GEN_ID: ST_${Date.now().toString().substring(6)} // THEME: ${activeStyle.name}`, canvas.width / 2, 290);

      ctx.fillStyle = activeStyle.accentColor;
      ctx.font = `bold 120px ${activeStyle.fontFamily}`;
      ctx.fillText("“", canvas.width / 2, 380);

      ctx.fillStyle = activeStyle.textColor;
      ctx.font = `bold 52px ${activeStyle.fontFamily}`;
      
      const words = textToDraw.split(' ');
      const lines = [];
      let currentLine = '';
      const maxTextWidth = boxW - 140;

      for (let n = 0; n < words.length; n++) {
        let testLine = currentLine + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxTextWidth && n > 0) {
          lines.push(currentLine.trim());
          currentLine = words[n] + ' ';
        } else {
          currentLine = testLine;
        }
      }
      lines.push(currentLine.trim());

      const lineHeight = 75;
      const totalTextHeight = lines.length * lineHeight;
      let startY = (boxY + (boxH / 2)) - (totalTextHeight / 2) + (lineHeight / 2);

      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], canvas.width / 2, startY + (i * lineHeight));
      }

      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = activeStyle.subTextColor;
      ctx.font = `24px monospace`;
      ctx.fillText(`DATE: ${dateStr || 'ACTIVE'}`, canvas.width / 2, boxY + boxH - 120);

      ctx.fillStyle = activeStyle.accentColor;
      ctx.font = `bold 28px ${activeStyle.fontFamily}`;
      ctx.fillText("atoms.free.bg", canvas.width / 2, boxY + boxH - 60);

      ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
      ctx.font = "20px monospace";
      ctx.fillText("SHARE TO STORIES // PERSISTENCE ACTIVE", canvas.width / 2, canvas.height - 180);

      return canvas.toDataURL("image/png");
    }

    // РЕНДЕР 2: КВАДРАТЕН КИБЕР СТИЛ (1080x1080)
    function generateStandardCanvasCard(textToDraw, storedLocation) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 1080; canvas.height = 1080;

      const bgGradient = ctx.createRadialGradient(540, 540, 100, 540, 540, 800);
      bgGradient.addColorStop(0, "#0c1013"); bgGradient.addColorStop(1, "#040507");
      ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(0, 255, 51, 0.015)"; ctx.lineWidth = 1;
      for (let i = 0; i < canvas.height; i += 4) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      ctx.strokeStyle = "#00ff33"; ctx.lineWidth = 6; const pad = 35; const len = 50;
      ctx.beginPath(); ctx.moveTo(pad + len, pad); ctx.lineTo(pad, pad); ctx.lineTo(pad, pad + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(canvas.width - pad - len, pad); ctx.lineTo(canvas.width - pad, pad); ctx.lineTo(canvas.width - pad, pad + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad + len, canvas.height - pad); ctx.lineTo(pad, canvas.height - pad); ctx.lineTo(pad, canvas.height - pad - len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(canvas.width - pad - len, canvas.height - pad); ctx.lineTo(canvas.width - pad, canvas.height - pad); ctx.lineTo(canvas.width - pad, canvas.height - pad - len); ctx.stroke();

      ctx.strokeStyle = "rgba(0, 255, 51, 0.15)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(55, 95); ctx.lineTo(canvas.width - 55, 95); ctx.stroke();

      ctx.fillStyle = "rgba(0, 255, 51, 0.6)"; ctx.font = "bold 24px monospace";
      ctx.textAlign = "left";
      ctx.fillText("▲ ATMOS TERMINAL // SYSTEM_ACTIVE", 75, 75);
      
      ctx.fillStyle = "rgba(0, 255, 51, 0.4)"; ctx.font = "bold 22px monospace";
      ctx.fillText("× ×", canvas.width - 120, 75);

      ctx.font = "bold 42px monospace";
      const words = textToDraw.split(' '); const lines = []; let currentLine = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = currentLine + words[n] + ' ';
        if (ctx.measureText(testLine).width > (canvas.width - 180) && n > 0) {
          lines.push(currentLine.trim()); currentLine = words[n] + ' ';
        } else { currentLine = testLine; }
      }
      lines.push(currentLine.trim());

      const totalHeight = lines.length * 65;
      let startY = (canvas.height / 2) - (totalHeight / 2) + 20;

      ctx.fillStyle = "#00ff44";
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], 90, startY + (i * 65));
      }

      ctx.strokeStyle = "rgba(0, 255, 51, 0.15)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(55, canvas.height - 115); ctx.lineTo(canvas.width - 55, canvas.height - 115); ctx.stroke();

      let dynamicLocation = storedLocation;
      if (!dynamicLocation) {
        const fakeLocations = ["TERMINAL CORE", "LOCAL STORAGE", "ERROR 404", "SYSTEM32 ROOT", "127.0.0.1", "NULL POINTER", "UNKNOWN NODE", "PROXY LOOPBACK", "DEEP WEB ANON", "KERNEL PANIC", "ROOT DIRECTORY"];
        dynamicLocation = fakeLocations[Math.floor(Math.random() * fakeLocations.length)];
      }

      ctx.fillStyle = "rgba(255, 255, 255, 0.25)"; ctx.font = "18px monospace";
      ctx.fillText(`▶ NODE: ATOMS.FREE.BG // LOCATION: ${dynamicLocation}`, 75, canvas.height - 85);
      ctx.fillText("SECURITY: ENCRYPTED_STATUS_OK", 75, canvas.height - 60);

      ctx.fillStyle = "rgba(0, 255, 51, 0.15)";
      ctx.fillRect(canvas.width - 230, canvas.height - 88, 150, 20);
      ctx.fillStyle = "#00ff33";
      ctx.fillRect(canvas.width - 230, canvas.height - 88, 100, 20);

      return canvas.toDataURL("image/png");
    }


        // РЕНДЕР 5: ATMOS RUNE (single, 1080x1920)
    function runesWrapTextLocal(ctx, text, maxWidth, maxLines) {
      const words = (text || "").split(" ");
      const lines = [];
      let cur = "";
      for (let i = 0; i < words.length; i++) {
        const test = cur + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i > 0) {
          lines.push(cur.trim());
          cur = words[i] + " ";
          if (maxLines && lines.length >= maxLines) {
            if (cur.trim()) lines[lines.length - 1] += "...";
            return lines;
          }
        } else {
          cur = test;
        }
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }

    function runesGetLayoutLocal(count) {
      const usable = 1080 - 200;
      let gap, cardW;
      if (count <= 3) { gap = 30; }
      else if (count === 4) { gap = 22; }
      else { gap = 16; }

      cardW = Math.floor((usable - gap * (count - 1)) / count);
      if (count <= 3) cardW = Math.min(cardW, 260);

      const cardH = Math.floor(cardW * 1.5);
      const totalW = count * cardW + (count - 1) * gap;
      const startX = (1080 - totalW) / 2;
      return { cardW, cardH, gap, startX, cardY: 500 };
    }

    async function generateRuneCanvasCard(data) {
      const S = {
        bgTop: "#071018", bgMid: "#0d1b2a", bgBot: "#030608",
        accent: "#8ecae6", accentSoft: "rgba(142, 202, 230, 0.35)",
        accentDeep: "#64ffda", textPrimary: "#e0f4ff",
        textMuted: "rgba(224, 244, 255, 0.55)",
        fontHead: "serif", fontMono: "monospace"
      };

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 1080; canvas.height = 1920;

      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, S.bgTop);
      bgGrad.addColorStop(0.5, S.bgMid);
      bgGrad.addColorStop(1, S.bgBot);
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(200, 230, 255, 0.10)";
      for (let i = 0; i < 400; i++) {
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
      }

      ctx.strokeStyle = S.accentSoft; ctx.lineWidth = 2;
      ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
      ctx.strokeStyle = S.accent; ctx.lineWidth = 1;
      ctx.strokeRect(55, 55, canvas.width - 110, canvas.height - 110);

      ctx.textAlign = "center"; ctx.textBaseline = "middle";

      ctx.fillStyle = S.accentDeep; ctx.font = `bold 36px serif`;

    function oghamWrapTextLocal(ctx, text, maxWidth, maxLines) {
      const words = (text || "").split(" ");
      const lines = [];
      let cur = "";
      for (let i = 0; i < words.length; i++) {
        const test = cur + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i > 0) {
          lines.push(cur.trim());
          cur = words[i] + " ";
          if (maxLines && lines.length >= maxLines) {
            if (cur.trim()) lines[lines.length - 1] += "...";
            return lines;
          }
        } else {
          cur = test;
        }
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }

    function oghamGetLayoutLocal(count) {
      const usable = 1080 - 200;
      let gap, cardW;
      if (count <= 3) { gap = 30; }
      else if (count === 4) { gap = 22; }
      else { gap = 16; }

      cardW = Math.floor((usable - gap * (count - 1)) / count);
      if (count <= 3) cardW = Math.min(cardW, 260);

      const cardH = Math.floor(cardW * 1.5);
      const totalW = count * cardW + (count - 1) * gap;
      const startX = (1080 - totalW) / 2;
      return { cardW, cardH, gap, startX, cardY: 500 };
    }

    // РЕНДЕР 6: ATMOS RUNES READING (1080x1920) + RUNIC WHEEL
    function runesWrapTextLocal(ctx, text, maxWidth, maxLines) {
      const words = (text || "").split(" ");
      const lines = [];
      let cur = "";
      for (let i = 0; i < words.length; i++) {
        const test = cur + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i > 0) {
          lines.push(cur.trim());
          cur = words[i] + " ";
          if (maxLines && lines.length >= maxLines) {
            if (cur.trim()) lines[lines.length - 1] += "...";
            return lines;
          }
        } else {
          cur = test;
        }
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }

    function runesGetLayoutLocal(count) {
      const usable = 1080 - 200;
      let gap, cardW;
      if (count <= 3) { gap = 30; }
      else if (count === 4) { gap = 22; }
      else { gap = 16; }

      cardW = Math.floor((usable - gap * (count - 1)) / count);
      if (count <= 3) cardW = Math.min(cardW, 260);

      const cardH = Math.floor(cardW * 1.5);
      const totalW = count * cardW + (count - 1) * gap;
      const startX = (1080 - totalW) / 2;
      return { cardW, cardH, gap, startX, cardY: 500 };
    }

      ctx.fillText("✦ ATMOS TAROT ✦", canvas.width / 2, 140);

      ctx.fillStyle = STYLE.textMuted;
      ctx.font = `20px ${STYLE.fontMono}`;
      ctx.fillText(`CARD OF THE DAY // ${data.date || 'ACTIVE'}`, canvas.width / 2, 190);

      /* ---------- ПОЗИЦИЯ ---------- */
      const posText = data.isReversed ? "⚏ ОБЪРНАТА" : "⚏ ПРАВА";
      ctx.fillStyle = data.isReversed ? "#ff8888" : STYLE.accent;
      ctx.font = `bold 24px ${STYLE.fontMono}`;
      ctx.fillText(posText, canvas.width / 2, 245);

      /* ---------- КАРТИНКА ---------- */
      const cardX = 190;
      const cardY = 300;
      const cardW = canvas.width - 380;
      const cardH = 1100;
      const cardCX = cardX + cardW / 2;
      const cardCY = cardY + cardH / 2;

      let imgLoaded = false;

      if (data.imageUrl) {
        try {
          const img = await new Promise((resolve, reject) => {
            const i = new Image();
            i.crossOrigin = "anonymous";
            i.onload = () => resolve(i);
            i.onerror = () => reject(new Error("load-failed"));
            i.src = data.imageUrl;
          });

          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.fillRect(cardX - 8, cardY - 8, cardW + 16, cardH + 16);
          ctx.strokeStyle = STYLE.accent;
          ctx.lineWidth = 3;
          ctx.strokeRect(cardX - 8, cardY - 8, cardW + 16, cardH + 16);

          const imgRatio = img.width / img.height;
          const boxRatio = cardW / cardH;
          let dw, dh;
          if (imgRatio > boxRatio) { dw = cardW; dh = cardW / imgRatio; }
          else { dh = cardH; dw = cardH * imgRatio; }
          const dx = cardX + (cardW - dw) / 2;
          const dy = cardY + (cardH - dh) / 2;

          if (data.isReversed) {
            ctx.save();
            ctx.translate(dx + dw / 2, dy + dh / 2);
            ctx.rotate(Math.PI);
            ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
            ctx.restore();
          } else {
            ctx.drawImage(img, dx, dy, dw, dh);
          }
          imgLoaded = true;
        } catch (e) {
          console.warn("Tarot image load failed:", e);
        }
      }

      if (!imgLoaded) {
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(cardX, cardY, cardW, cardH);
        ctx.strokeStyle = STYLE.accent;
        ctx.lineWidth = 2;
        ctx.strokeRect(cardX, cardY, cardW, cardH);
        ctx.fillStyle = STYLE.accent;
        ctx.font = `bold 320px serif`;
        ctx.fillText(data.symbol || "✦", cardCX, cardCY);
        ctx.fillStyle = STYLE.textMuted;

      }

      /* ---------- ИМЕ ---------- */
      const nameY = cardY + cardH + 70;
      ctx.fillStyle = STYLE.textPrimary;
      ctx.font = `bold 56px ${STYLE.fontHead}`;
      ctx.fillText(data.cardName || "Tarot", canvas.width / 2, nameY);

      const kwY = nameY + 110;
      const kwText = kws.join("  •  ");
      ctx.fillStyle = STYLE.accent;
      ctx.font = `bold 22px ${STYLE.fontMono}`;
      ctx.fillText(kwText.toUpperCase(), canvas.width / 2, kwY);

      /* ---------- ОПИСАНИЕ ---------- */
      const meaning = data.meaning || "";
      ctx.fillStyle = STYLE.textPrimary;
      ctx.font = `28px ${STYLE.fontHead}`;

      const maxWidth = canvas.width - 200;
      const words = meaning.split(" ");
      const lines = [];
      let current = "";
      for (let i = 0; i < words.length; i++) {
        const test = current + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i > 0) {
          lines.push(current.trim());
          current = words[i] + " ";
        } else {
          current = test;
        }
      }
      lines.push(current.trim());

      const descStartY = kwY + 70;
      const lineH = 42;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], canvas.width / 2, descStartY + i * lineH);

      /* ---------- FOOTER ---------- */
      ctx.fillStyle = STYLE.accentSoft;
      ctx.fillRect(120, canvas.height - 130, canvas.width - 240, 1);

      ctx.fillStyle = STYLE.textMuted;
      ctx.font = `18px ${STYLE.fontMono}`;
      ctx.fillText("ATMOS TAROT ENGINE // 78 CARDS", canvas.width / 2, canvas.height - 90);

      ctx.fillStyle = STYLE.accent;
      ctx.font = `bold 22px ${STYLE.fontHead}`;
      ctx.fillText("atoms.free.bg", canvas.width / 2, canvas.height - 55);

      return canvas.toDataURL("image/png");

    // РЕНДЕР 11: ATMOS CHAKRAS
    function chakraWrapTextLocal(ctx, text, maxWidth, maxLines) {
      const words = (text || "").split(" ");
      const lines = [];
      let cur = "";
      for (let i = 0; i < words.length; i++) {
        const test = cur + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i > 0) {
          lines.push(cur.trim());
          cur = words[i] + " ";
          if (maxLines && lines.length >= maxLines) {
            if (cur.trim()) lines[lines.length - 1] += "...";
            return lines;
          }
        } else {
          cur = test;
        }
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }

    function drawLotusLocal(ctx, cx, cy, radius, petals, color, mantra) {
      const petalCount = petals > 40 ? 40 : petals;
      for (let i = 0; i < petalCount; i++) {
        const angle = (i / petalCount) * Math.PI * 2 - Math.PI / 2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.beginPath();
        const py = -radius * 0.75;
        const rx = radius * 0.22;
        const ry = radius * 0.5;
        ctx.ellipse(0, py, rx, ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = color + "30";
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.62, 0, Math.PI * 2);
      ctx.fillStyle = color + "60";
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.stroke();

      if (mantra) {
        ctx.fillStyle = "#fff";
        ctx.font = `bold ${Math.floor(radius * 0.55)}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(mantra, cx, cy);
      }
    }

    function tarotReadingWrapText(ctx, text, maxWidth, maxLines) {
      const words = (text || "").split(" ");
      const lines = [];

    function tarotReadingGetLayout(count) {
      const usable = 1080 - 200;
      let gap, cardW;
      if (count <= 3) { gap = 30; }
      else if (count === 4) { gap = 22; }
      else { gap = 16; }

      cardW = Math.floor((usable - gap * (count - 1)) / count);
      if (count <= 3) cardW = Math.min(cardW, 260);

      const cardH = Math.floor(cardW * 1.5);
      const totalW = count * cardW + (count - 1) * gap;
      const startX = (1080 - totalW) / 2;
      return { cardW, cardH, gap, startX, cardY: 500 };
    }

    function sigilBuildPointsLocal(numbers, cx, cy, radius) {
      const points = [];
      const isCyrillic = Math.max(...numbers) > 26;
      for (let i = 0; i < numbers.length; i++) {
        const n = numbers[i];
        const maxN = isCyrillic ? 30 : 26;
        const angle = (n * 2 * Math.PI) / maxN;
        const length = radius * (0.35 + (n / maxN) * 0.6);
        const x = cx + length * Math.cos(angle);
        const y = cy + length * Math.sin(angle);
        points.push({ x, y });

      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();

      ctx.strokeStyle = "rgba(212, 175, 55, 0.4)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.lineTo(cx, cy);
      ctx.stroke();

      ctx.fillStyle = S.accentDeep;
      for (const p of points) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#fff8dc";
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = S.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 12, 0, Math.PI * 2);
      ctx.stroke();
    }

    // =========================================================
    function lenormandWrapTextLocal(ctx, text, maxWidth, maxLines) {
      const words = (text || "").split(" ");
      const lines = [];
      let cur = "";
      for (let i = 0; i < words.length; i++) {
        const test = cur + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i > 0) {
          lines.push(cur.trim());
          cur = words[i] + " ";
          if (maxLines && lines.length >= maxLines) {
            if (cur.trim()) lines[lines.length - 1] += "...";
            return lines;
          }
        } else {
          cur = test;
        }
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }

        // =========================================================
    // РЕНДЕР 18: ATMOS PSYCHE (v4.0)

    function psycheWrapTextLocal(ctx, text, maxWidth, maxLines) {
      const words = (text || "").split(" ");
      const lines = [];
      let cur = "";
      for (let i = 0; i < words.length; i++) {
        const test = cur + words[i] + " ";
        if (ctx.measureText(test).width > maxWidth && i > 0) {
          lines.push(cur.trim());
          cur = words[i] + " ";
          if (maxLines && lines.length >= maxLines) {
            if (cur.trim()) lines[lines.length - 1] += "...";
            return lines;
          }
        } else {
          cur = test;
        }
      }
      if (cur.trim()) lines.push(cur.trim());
      return lines;
    }

    function psycheLoadImageLocal(url) {
      return new Promise((resolve, reject) => {
        if (!url) return reject(new Error("no-url"));
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("load-failed"));
        img.src = url;
      });
    }

      }

      ctx.strokeStyle = S.accentSoft; ctx.lineWidth = 2;
      ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

      ctx.strokeRect(55, 55, canvas.width - 110, canvas.height - 110);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = S.accent;
      ctx.font = `bold 36px serif`;

      ctx.fillText("✦", canvas.width - 95, 95);
      ctx.fillText("✦", 95, canvas.height - 95);
      ctx.fillText("✦", canvas.width - 95, canvas.height - 95);

      ctx.font = `18px ${S.fontMono}`;

      const imgMaxH = 900;
      const imgLeftX = (canvas.width - imgMaxW) / 2;

      const sel = d.layerSelection || { type: 'none', layers: [] };
      let actualImgH = 0;
      let actualImgW = imgMaxW;
      let actualImgX = imgLeftX;

      if (sel.layers && sel.layers.length > 0) {
        const images = await Promise.all(
          sel.layers.map(l => psycheLoadImageLocal(l.imageUrl).catch(() => null))

          let dw = imgMaxW;
          let dh = imgMaxW / ratio;
          if (dh > imgMaxH) {
            dh = imgMaxH;
            dw = imgMaxH * ratio;
          }
          const dx = (canvas.width - dw) / 2;

          ctx.globalAlpha = layer.opacity !== undefined ? layer.opacity : 1.0;

            actualImgH = dh;
            actualImgW = dw;
            actualImgX = dx;

        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1.0;

        if (sel.tint && actualImgH > 0) {
          ctx.fillStyle = sel.tint;
          ctx.fillRect(actualImgX, imgY, actualImgW, actualImgH);
        }

        actualImgH = 400;
        ctx.fillStyle = "rgba(0,0,0,0.4)";

        ctx.strokeRect(actualImgX, imgY, actualImgW, actualImgH);
        ctx.fillStyle = S.accent;
        ctx.font = `bold 24px ${S.fontMono}`;

            dw = actualImgH * ratio;

          const dy = imgY + (actualImgH - dh) / 2;

          const tempCanvas = document.createElement("canvas");
          tempCanvas.width = dw;
          tempCanvas.height = dh;
          const tempCtx = tempCanvas.getContext("2d");

          const cx = dw / 2;
          const cy = dh / 2;

          maskGrad.addColorStop(0.5, "rgba(255,255,255,0.4)");
          maskGrad.addColorStop(1, "rgba(255,255,255,0)");

          tempCtx.globalCompositeOperation = 'destination-in';
          tempCtx.fillStyle = maskGrad;
          tempCtx.fillRect(0, 0, dw, dh);

          ctx.globalAlpha = 0.65;
          ctx.drawImage(tempCanvas, dx, dy);
