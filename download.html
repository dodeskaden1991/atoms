<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atmos Core // Download Engine</title>
  <style>
    body {
      margin: 0; background: #07090b; color: #00ff33;
      font-family: monospace; display: flex; flex-direction: column;
      justify-content: center; align-items: center; min-height: 100vh;
    }
    .loader { font-size: 18px; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; text-align: center; }
    .status { color: #888; font-size: 14px; text-transform: uppercase; text-align: center; max-width: 90%; margin-bottom: 20px; line-height: 1.4; }
    
    /* Стил за резервния бутон при мобилни устройства */
    .download-btn {
      display: none; background: #00ff33; color: #000; 
      padding: 12px 24px; border: none; font-weight: bold; 
      font-family: monospace; cursor: pointer; text-transform: uppercase;
      text-decoration: none; box-shadow: 0 0 15px rgba(0, 255, 51, 0.4);
      margin-top: 15px; font-size: 14px;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Конфигурация на проекта atoms-32b0d
    const firebaseConfig = {
      apiKey: "AIzaSyAGF9BsM0_OMADMYiTIpIFQ3rlWPQIcP-M",
      authDomain: "atoms-32b0d.firebaseapp.com",
      databaseURL: "https://atoms-32b0d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "atoms-32b0d",
      storageBucket: "atoms-32b0d.appspot.com",
      messagingSenderId: "358321648052",
      appId: "1:358321648052:web:2f58f230f8b1384121c2e1",
      measurementId: "G-MFJNLQMEH2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Синхронизиран пул с 16 стила за Stories
    const storyStyles = [
      { name: "CYBER_SUNSET", bgGradient: ["#f9d423", "#ff4e50", "#f857a6"], textColor: "#ffffff", accentColor: "#f857a6", subTextColor: "rgba(255, 255, 255, 0.4)", borderColor: "rgba(255, 255, 255, 0.2)", fontFamily: "sans-serif", decorations: "circle" },
      { name: "AURORA_CHILL", bgGradient: ["#00c6ff", "#0072ff", "#130cb7"], textColor: "#ffffff", accentColor: "#00f6ff", subTextColor: "rgba(255, 255, 255, 0.5)", borderColor: "rgba(0, 246, 255, 0.25)", fontFamily: "monospace", decorations: "cross" },
      { name: "NEO_MINT", bgGradient: ["#0ba360", "#3cba92", "#111111"], textColor: "#ffffff", accentColor: "#3cba92", subTextColor: "rgba(255, 255, 255, 0.4)", borderColor: "rgba(60, 186, 146, 0.3)", fontFamily: "sans-serif", decorations: "lines" },
      { name: "AESTHETIC_NOIR", bgGradient: ["#2c3e50", "#000000", "#111111"], textColor: "#f5f5f7", accentColor: "#e55d87", subTextColor: "rgba(255, 255, 255, 0.3)", borderColor: "rgba(255, 255, 255, 0.1)", fontFamily: "serif", decorations: "minimal" },
      { name: "TOXIC_MATRIX", bgGradient: ["#000000", "#051307", "#00ff33"], textColor: "#00ff33", accentColor: "#ffffff", subTextColor: "rgba(0, 255, 51, 0.3)", borderColor: "rgba(0, 255, 51, 0.4)", fontFamily: "monospace", decorations: "cross" },
      { name: "ELECTRIC_PLUM", bgGradient: ["#61045f", "#aa076b", "#1a0018"], textColor: "#ffffff", accentColor: "#ff007f", subTextColor: "rgba(255, 255, 255, 0.35)", borderColor: "rgba(255, 0, 127, 0.25)", fontFamily: "sans-serif", decorations: "circle" },
      { name: "VAPOR_DREAM", bgGradient: ["#74ebd5", "#9ecefa", "#acb6e5"], textColor: "#111111", accentColor: "#ff4081", subTextColor: "rgba(17, 17, 17, 0.4)", borderColor: "rgba(17, 17, 17, 0.15)", fontFamily: "sans-serif", decorations: "circle" },
      { name: "ECLIPSE_RED", bgGradient: ["#110000", "#4a0000", "#000000"], textColor: "#ffffff", accentColor: "#ff3333", subTextColor: "rgba(255, 51, 51, 0.3)", borderColor: "rgba(255, 51, 51, 0.2)", fontFamily: "serif", decorations: "cross" },
      { name: "ZEN_MATCHA", bgGradient: ["#a8ff78", "#78ffd6"], textColor: "#1e3d2f", accentColor: "#000000", subTextColor: "rgba(30, 61, 47, 0.5)", borderColor: "rgba(30, 61, 47, 0.2)", fontFamily: "serif", decorations: "minimal" },
      { name: "GOLDEN_DUNES", bgGradient: ["#111a24", "#c29c53", "#1a2a3a"], textColor: "#ffffff", accentColor: "#f3e5ab", subTextColor: "rgba(243, 229, 171, 0.4)", borderColor: "rgba(194, 156, 83, 0.3)", fontFamily: "serif", decorations: "lines" },
      { name: "NEBULA_CORE", bgGradient: ["#4e54c8", "#8f94fb", "#000000"], textColor: "#ffffff", accentColor: "#8f94fb", subTextColor: "rgba(255, 255, 255, 0.4)", borderColor: "rgba(143, 148, 251, 0.3)", fontFamily: "monospace", decorations: "cross" },
      { name: "CORAL_REEF", bgGradient: ["#ff9966", "#ff5e62"], textColor: "#ffffff", accentColor: "#ffffff", subTextColor: "rgba(255, 255, 255, 0.5)", borderColor: "rgba(255, 255, 255, 0.25)", fontFamily: "sans-serif", decorations: "circle" },
      { name: "TOKYO_NOIR", bgGradient: ["#0f2027", "#203a43", "#2c5364"], textColor: "#00ffcc", accentColor: "#ff007f", subTextColor: "rgba(255, 255, 255, 0.4)", borderColor: "rgba(0, 255, 204, 0.2)", fontFamily: "monospace", decorations: "lines" },
      { name: "ICE_BREAKER", bgGradient: ["#e0eafc", "#cfdef3"], textColor: "#2c3e50", accentColor: "#0072ff", subTextColor: "rgba(44, 62, 80, 0.5)", borderColor: "rgba(44, 62, 80, 0.15)", fontFamily: "sans-serif", decorations: "minimal" },
      { name: "AMBER_ALERT", bgGradient: ["#ff4e50", "#f9d423", "#111111"], textColor: "#ffffff", accentColor: "#ff4e50", subTextColor: "rgba(255, 255, 255, 0.35)", borderColor: "rgba(255, 78, 80, 0.25)", fontFamily: "monospace", decorations: "cross" },
      { name: "SOFT_CREAM", bgGradient: ["#f7f5f0", "#eaddca"], textColor: "#333333", accentColor: "#8b5a2b", subTextColor: "rgba(51, 51, 51, 0.4)", borderColor: "rgba(139, 90, 43, 0.2)", fontFamily: "serif", decorations: "minimal" }
    ];

    function updateStatus(msg, isError = false) {
      const el = document.getElementById('status');
      if (isError) {
        el.innerHTML = `<span style="color: #ff3333;">[CRITICAL ERROR] ${msg}</span>`;
      } else {
        el.innerText = `[SYSTEM] ${msg}`;
      }
    }

    async function startProcess() {
      try {
        updateStatus("Свързване с централната база данни...");
        
        const dataRef = db.ref('fortune_buffer');
        const snapshot = await dataRef.once('value');
        
        if (!snapshot.exists()) {
          updateStatus("Буферът е празен. Генерирайте съдържание от конзолата.", true);
          return;
        }

        const data = snapshot.val();
        let imageBase64 = "";
        let fileNamePrefix = "atmos_fortune";

        if (data.isStory === true) {
          updateStatus(`Засичане на Story пакет. Извличане на дизайн тема...`);
          const styleIdx = data.styleMode !== undefined ? data.styleMode : 0;
          
          imageBase64 = generateStoryCanvasCard(data.text, styleIdx, data.date || "");
          fileNamePrefix = "atmos_story";
        } else {
          updateStatus("Засичане на стандартно късметче. Синхронизиране на локация и рендериране...");
          // Подаваме целия обект на данните, за да извадим локацията, ако е записана, или я регенерираме синхронно
          imageBase64 = generateStandardCanvasCard(data.text, data.location);
        }

        updateStatus("Генерирането завърши. Иницииране на изтегляне...");
        
        const fileName = `${fileNamePrefix}_${data.date || 'share'}.png`;

        const fallbackBtn = document.getElementById('fallbackBtn');
        fallbackBtn.href = imageBase64;
        fallbackBtn.download = fileName;
        fallbackBtn.style.display = "inline-block";

        const link = document.createElement('a');
        link.href = imageBase64;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        updateStatus("Файлът е изпратен към браузъра. Ако не стартира, натисни бутона по-долу.");

        setTimeout(() => {
          document.getElementById('status').innerHTML = "<span style='color:#fff;'>[INFO] Готово! Ако файлът се е свалил, можеш да затвориш този таб.</span>";
        }, 3000);

      } catch (error) {
        console.error(error);
        updateStatus("Грешка при прехвърляне на данни.", true);
      }
    }

    // РЕНДЕР 1: МОДЕРЕН ВЕРТИКАЛЕН СТОРИ СТИЛ (1080x1920)
    function generateStoryCanvasCard(textToDraw, styleIdx, dateStr) {
      const activeStyle = storyStyles[styleIdx] || storyStyles[0];
      
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 1080; canvas.height = 1920;

      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, activeStyle.bgGradient[0]);
      bgGrad.addColorStop(0.5, activeStyle.bgGradient[1]);
      if (activeStyle.bgGradient[2]) {
        bgGrad.addColorStop(1, activeStyle.bgGradient[2]);
      } else {
        bgGrad.addColorStop(1, activeStyle.bgGradient[1]);
      }
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.015)";
      for (let i = 0; i < 80000; i++) {
        const rx = Math.random() * canvas.width;
        const ry = Math.random() * canvas.height;
        ctx.fillRect(rx, ry, 2, 2);
      }

      if (activeStyle.decorations === "circle") {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 400, 0, Math.PI * 2); ctx.stroke();
      } else if (activeStyle.decorations === "cross") {
        ctx.strokeStyle = activeStyle.accentColor; ctx.lineWidth = 2;
        const offset = 100;
        ctx.beginPath(); ctx.moveTo(offset, offset); ctx.lineTo(offset + 20, offset); ctx.moveTo(offset, offset); ctx.lineTo(offset, offset + 20);
        ctx.moveTo(canvas.width - offset, offset); ctx.lineTo(canvas.width - offset - 20, offset); ctx.moveTo(canvas.width - offset, offset); ctx.lineTo(canvas.width - offset, offset + 20);
        ctx.stroke();
      } else if (activeStyle.decorations === "lines") {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)"; ctx.lineWidth = 1;
        for (let l = 200; l < canvas.width; l += 200) {
          ctx.beginPath(); ctx.moveTo(l, 0); ctx.lineTo(l, canvas.height); ctx.stroke();
        }
      }

      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.strokeStyle = activeStyle.borderColor;
      ctx.lineWidth = 2;
      const boxX = 100; const boxY = 450; const boxW = canvas.width - 200; const boxH = 950;
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillStyle = activeStyle.textColor;
      ctx.font = `bold 32px ${activeStyle.fontFamily}`;
      ctx.fillText("▲ ATMOS ENGINE // DISCOVERED", canvas.width / 2, 250);

      ctx.fillStyle = activeStyle.subTextColor;
      ctx.font = `18px monospace`;
      ctx.fillText(`GEN_ID: ST_${Date.now().toString().substring(6)} // THEME: ${activeStyle.name}`, canvas.width / 2, 290);

      ctx.fillStyle = activeStyle.accentColor;
      ctx.font = `bold 120px ${activeStyle.fontFamily}`;
      ctx.fillText("“", canvas.width / 2, 380);

      ctx.fillStyle = activeStyle.textColor;
      ctx.font = `bold 52px ${activeStyle.fontFamily}`;
      
      const words = textToDraw.split(' ');
      const lines = [];
      let currentLine = '';
      const maxTextWidth = boxW - 140;

      for (let n = 0; n < words.length; n++) {
        let testLine = currentLine + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxTextWidth && n > 0) {
          lines.push(currentLine.trim());
          currentLine = words[n] + ' ';
        } else {
          currentLine = testLine;
        }
      }
      lines.push(currentLine.trim());

      const lineHeight = 75;
      const totalTextHeight = lines.length * lineHeight;
      let startY = (boxY + (boxH / 2)) - (totalTextHeight / 2) + (lineHeight / 2);

      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], canvas.width / 2, startY + (i * lineHeight));
      }

      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = activeStyle.subTextColor;
      ctx.font = `24px monospace`;
      ctx.fillText(`DATE: ${dateStr || 'ACTIVE'}`, canvas.width / 2, boxY + boxH - 120);

      ctx.fillStyle = activeStyle.accentColor;
      ctx.font = `bold 28px ${activeStyle.fontFamily}`;
      ctx.fillText("atoms.free.bg", canvas.width / 2, boxY + boxH - 60);

      ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
      ctx.font = "20px monospace";
      ctx.fillText("SHARE TO STORIES // PERSISTENCE ACTIVE", canvas.width / 2, canvas.height - 180);

      return canvas.toDataURL("image/png");
    }

    // РЕНДЕР 2: ОБНОВЕН КВАДРАТЕН КИБЕР СТИЛ (1080x1080) - СИНХРОНИЗИРАН С MAIN.JS
    function generateStandardCanvasCard(textToDraw, storedLocation) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = 1080; canvas.height = 1080;

      // Радиален градиент за дълбок терминален обем
      const bgGradient = ctx.createRadialGradient(540, 540, 100, 540, 540, 800);
      bgGradient.addColorStop(0, "#0c1013"); bgGradient.addColorStop(1, "#040507");
      ctx.fillStyle = bgGradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Фонови скан-линии
      ctx.strokeStyle = "rgba(0, 255, 51, 0.015)"; ctx.lineWidth = 1;
      for (let i = 0; i < canvas.height; i += 4) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Дебели неонови ъгли (ДЖИДЖАНИЯТ СТИЛ)
      ctx.strokeStyle = "#00ff33"; ctx.lineWidth = 6; const pad = 35; const len = 50;
      ctx.beginPath(); ctx.moveTo(pad + len, pad); ctx.lineTo(pad, pad); ctx.lineTo(pad, pad + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(canvas.width - pad - len, pad); ctx.lineTo(canvas.width - pad, pad); ctx.lineTo(canvas.width - pad, pad + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pad + len, canvas.height - pad); ctx.lineTo(pad, canvas.height - pad); ctx.lineTo(pad, canvas.height - pad - len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(canvas.width - pad - len, canvas.height - pad); ctx.lineTo(canvas.width - pad, canvas.height - pad); ctx.lineTo(canvas.width - pad, canvas.height - pad - len); ctx.stroke();

      // Тънка хоризонтална разделителна линия под хедъра
      ctx.strokeStyle = "rgba(0, 255, 51, 0.15)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(55, 95); ctx.lineTo(canvas.width - 55, 95); ctx.stroke();

      // Текстове в Хедъра
      ctx.fillStyle = "rgba(0, 255, 51, 0.6)"; ctx.font = "bold 24px monospace";
      ctx.textAlign = "left";
      ctx.fillText("▲ ATMOS TERMINAL // SYSTEM_ACTIVE", 75, 75);
      
      ctx.fillStyle = "rgba(0, 255, 51, 0.4)"; ctx.font = "bold 22px monospace";
      ctx.fillText("× ×", canvas.width - 120, 75);

      // Мащабиране и изчертаване на основния текст на късмета
      ctx.font = "bold 42px monospace";
      const words = textToDraw.split(' '); const lines = []; let currentLine = '';
      for (let n = 0; n < words.length; n++) {
        let testLine = currentLine + words[n] + ' ';
        if (ctx.measureText(testLine).width > (canvas.width - 180) && n > 0) {
          lines.push(currentLine.trim()); currentLine = words[n] + ' ';
        } else { currentLine = testLine; }
      }
      lines.push(currentLine.trim());

      const totalHeight = lines.length * 65;
      let startY = (canvas.height / 2) - (totalHeight / 2) + 20;

      ctx.fillStyle = "#00ff44";
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], 90, startY + (i * 65));
      }

      // Долна хоризонтална линия за Футъра
      ctx.strokeStyle = "rgba(0, 255, 51, 0.15)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(55, canvas.height - 115); ctx.lineTo(canvas.width - 55, canvas.height - 115); ctx.stroke();

      // Подсигуряване на локацията (Ако няма записана от базата данни, вадим рандом резервна)
      let dynamicLocation = storedLocation;
      if (!dynamicLocation) {
        const fakeLocations = ["TERMINAL CORE", "LOCAL STORAGE", "ERROR 404", "SYSTEM32 ROOT", "127.0.0.1", "NULL POINTER", "UNKNOWN NODE", "PROXY LOOPBACK", "DEEP WEB ANON", "KERNEL PANIC", "ROOT DIRECTORY"];
        dynamicLocation = fakeLocations[Math.floor(Math.random() * fakeLocations.length)];
      }

      // Ляв блок във Футъра
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)"; ctx.font = "18px monospace";
      ctx.fillText(`▶ NODE: ATOMS.FREE.BG // LOCATION: ${dynamicLocation}`, 75, canvas.height - 85);
      ctx.fillText("SECURITY: ENCRYPTED_STATUS_OK", 75, canvas.height - 60);

      // Десен блок във Футъра - Графична лента за прогрес
      ctx.fillStyle = "rgba(0, 255, 51, 0.15)";
      ctx.fillRect(canvas.width - 230, canvas.height - 88, 150, 20);
      ctx.fillStyle = "#00ff33";
      ctx.fillRect(canvas.width - 230, canvas.height - 88, 100, 20);

      return canvas.toDataURL("image/png");
    }

    window.addEventListener('DOMContentLoaded', startProcess);
  </script>
</head>
<body>
  <div class="loader">▲ ATMOS REMOTE DOWNLOAD CORE</div>
  <div class="status" id="status">[SYSTEM] Инициализиране...</div>
  
  <a id="fallbackBtn" class="download-btn">[СВАЛИ ИЗОБРАЖЕНИЕТО РЪЧНО]</a>
</body>
