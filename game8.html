<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пий & Играй</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{

  background:radial-gradient(circle at 50% 0%,#241640 0%,#0a0a14 60%);

  -webkit-font-smoothing:antialiased;
}
.screen{display:none;max-width:640px;margin:0 auto;padding:16px 0 40px}
.screen.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:2.2rem;text-align:center;margin:20px 0 6px;background:linear-gradient(135deg,#ff4e7a,#b14cff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.5rem;text-align:center;margin-bottom:20px;color:#eee}
p.sub{text-align:center;color:#9a8fb8;margin-bottom:28px;font-size:.95rem}
.btn{
  display:block;width:100%;padding:16px;margin:10px 0;
  border:none;border-radius:14px;font-size:1.05rem;font-weight:600;
  cursor:pointer;transition:transform .1s,filter .2s;background:#2a2a3d;color:#fff;
  font-family:inherit;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#ff4e7a,#b14cff);box-shadow:0 8px 24px rgba(177,76,255,.35)}
.btn.ghost{background:transparent;border:1px solid #3a3a4d;color:#bbb}
.btn.game{background:linear-gradient(135deg,#2a2040,#1a1230);border:1px solid #3a2a5a;padding:24px;font-size:1.2rem}
.btn.add{width:56px;height:56px;padding:0;font-size:1.8rem;line-height:1;border-radius:50%;background:linear-gradient(135deg,#ff4e7a,#b14cff);margin:0;flex-shrink:0;font-weight:400}
.btn.small{padding:8px 14px;width:auto;display:inline-block;font-size:.9rem;margin:0}
.name-input{display:flex;gap:10px;margin-bottom:18px}
.name-input input{flex:1;padding:14px 16px;border-radius:12px;border:1px solid #333;background:#1a1a2a;color:#fff;font-size:1rem;outline:none;font-family:inherit;transition:border-color .2s}
.name-input input:focus{border-color:#b14cff}
.player-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:44px}
.player-list.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.player-chip{background:#2a2a3d;padding:8px 12px 8px 14px;border-radius:20px;display:flex;align-items:center;gap:6px;font-size:.95rem;animation:fadeIn .2s}
.player-chip button{background:transparent;border:none;color:#ff6b8a;font-size:1.2rem;cursor:pointer;padding:0 4px;line-height:1}
.player-btn{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:14px 16px;border-radius:14px;border:1px solid #333;
  background:#1a1a2a;color:#fff;font-size:1rem;cursor:pointer;
  transition:all .15s;font-family:inherit;text-align:left;width:100%;
}
.player-btn:active{transform:scale(.96)}
.player-btn.selected{background:linear-gradient(135deg,#ff4e7a,#b14cff);border-color:transparent;box-shadow:0 6px 20px rgba(255,78,122,.4)}
.player-btn .pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-btn .cups{font-size:.9rem;opacity:.9;flex-shrink:0;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:10px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.round-badge{background:#2a2a3d;padding:8px 16px;border-radius:20px;font-size:.9rem;color:#ccc;flex-shrink:0}
.question-card{
  background:linear-gradient(135deg,#241a3d,#1a1230);
  border:1px solid #3a2a5a;border-radius:22px;
  padding:30px 24px;margin:16px 0;min-height:150px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.45);
}
.question-label{font-size:.9rem;color:#b14cff;font-weight:700;margin-bottom:10px;letter-spacing:.5px;text-transform:uppercase}
.question-text{font-size:1.3rem;line-height:1.5;font-weight:600}
.hint{color:#9a8fb8;font-size:.9rem;margin:16px 0 8px;text-align:center}
.hint b{color:#ff4e7a}
.boost{
  background:linear-gradient(135deg,#ffb800,#ff4e00);
  border-radius:16px;padding:16px;margin:12px 0;
  display:flex;gap:14px;align-items:center;
  color:#1a0a00;font-weight:700;
  box-shadow:0 8px 30px rgba(255,120,0,.5);
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.boost-icon{font-size:2.4rem;line-height:1}
.boost b{font-size:1.05rem;display:block;margin-bottom:2px}
.boost span{font-weight:500;font-size:.9rem;opacity:.9}
.popup-overlay{
  position:fixed;inset:0;background:rgba(5,0,20,.75);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:100;
}
.popup-overlay.active{display:flex;animation:fadeIn .3s}
.popup-box{
  background:linear-gradient(160deg,#2a1a4a,#150a28);
  border:1px solid #4a3a6a;border-radius:26px;
  padding:36px 26px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 60px rgba(177,76,255,.15);
  animation:pop .4s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.popup-icon{font-size:4.5rem;margin-bottom:14px;animation:bounce 1.1s infinite;line-height:1}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.popup-box h3{font-size:1.5rem;margin-bottom:10px;background:linear-gradient(135deg,#ffb800,#ff4e7a);-webkit-background-clip:text;background-clip:text;color:transparent}
.popup-box p{color:#cbbfe8;margin-bottom:22px;line-height:1.5}
@media(min-width:560px){
  .player-list.grid{grid-template-columns:repeat(3,1fr)}
  h1{font-size:2.6rem}
}
</style>
</head>
<body>
<div id="app">

<section id="homeScreen" class="screen active">
  <h1>🍻 Пий & Играй</h1>
  <p class="sub">Избери игра и започвайте</p>
  <button class="btn primary" onclick="go('lobbyScreen')">🎮 Лоби</button>
  <button class="btn ghost" onclick="location.href='index.html'">🏠 Начало</button>
</section>

<section id="lobbyScreen" class="screen">
  <h2>Избери игра</h2>
  <button class="btn game" onclick="startSetup('never')">🙅 Никога не съм</button>
  <button class="btn game" onclick="startSetup('truth')">🔥 Истина или на екс</button>
  <button class="btn ghost" onclick="go('homeScreen')">← Назад</button>
</section>

<section id="setupScreen" class="screen">
  <h2 id="setupTitle"></h2>
  <div class="name-input">
    <input id="playerName" type="text" placeholder="Име на играч..." maxlength="20" autocomplete="off">
    <button class="btn add" onclick="addPlayer()">+</button>
  </div>
  <div id="playerList" class="player-list"></div>
  <button class="btn primary" onclick="startGame()">▶ Старт</button>
  <button class="btn ghost" onclick="go('lobbyScreen')">← Назад</button>
</section>

<section id="neverScreen" class="screen">
  <div class="top-bar">
    <button class="btn small ghost" onclick="quitGame()">← Лоби</button>
    <span id="neverRound" class="round-badge">Рунд 1</span>
  </div>
  <div class="question-card">
    <p id="neverQuestion" class="question-text"></p>
  </div>
  <p class="hint">Маркирай кой пие 👇</p>
  <div id="neverPlayers" class="player-list grid"></div>
  <button class="btn primary" onclick="neverNext()">🔄 Нов въпрос</button>
</section>

<section id="truthScreen" class="screen">
  <div class="top-bar">
    <button class="btn small ghost" onclick="quitGame()">← Лоби</button>
    <span id="truthRound" class="round-badge">Рунд 1</span>
  </div>
  <div id="truthAskerPicker">
    <p class="hint"><b id="askerName"></b> пита — избери на кого 👇</p>
    <div id="truthPlayers" class="player-list grid"></div>
  </div>
  <div id="truthQuestionView" style="display:none">
    <div id="boostBanner" class="boost" style="display:none"></div>
    <div class="question-card">
      <p class="question-label" id="truthTargetLabel"></p>
      <p id="truthQuestion" class="question-text"></p>
    </div>
    <button class="btn primary" onclick="truthNext()">➡ Следващ рунд</button>
  </div>
</section>

<div id="popup" class="popup-overlay">
  <div class="popup-box">
    <div class="popup-icon">🍺</div>
    <h3 id="popupTitle">Време е за питие!</h3>
    <p id="popupText">Всички вдигат чаша и пият до дъно!</p>
    <button class="btn primary" onclick="closePopup()">Готово ✅</button>
  </div>
</div>

</div>

/* ========== СЪСТОЯНИЕ И ЛОГИКА ========== */
const state = {
  game: null,
  players: [],
  round: 0,
  nextDrinkThreshold: 0,
  never: { currentQ: null, selected: new Set(), used: new Set() },
  truth: { asker: null, target: null, currentQ: null, boost: null, used: new Set() }
};

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function vib(ms){ if(navigator.vibrate) navigator.vibrate(ms||10); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* --- Setup --- */
function startSetup(game){
  state.game = game;
  state.players = [];
  state.round = 0;
  state.never.used = new Set();
  state.truth.used = new Set();
  document.getElementById('setupTitle').textContent =
    game==='never' ? '🙅 Никога не съм' : '🔥 Истина или на екс';
  document.getElementById('playerName').value = '';
  renderSetupPlayers();
  go('setupScreen');
}
function addPlayer(){
  const input = document.getElementById('playerName');
  const name = input.value.trim();
  if(!name) return;
  if(state.players.length >= 20) return;
  state.players.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,6), name, cups:0});
  input.value='';
  input.focus();
  vib(8);
  renderSetupPlayers();
}
function removePlayer(id){
  state.players = state.players.filter(p=>p.id!==id);
  renderSetupPlayers();
}
function renderSetupPlayers(){
  document.getElementById('playerList').innerHTML = state.players.map(p=>
    `<div class="player-chip">${esc(p.name)}<button onclick="removePlayer('${p.id}')">×</button></div>`
  ).join('');
}
document.getElementById('playerName').addEventListener('keydown', e=>{
  if(e.key==='Enter'){e.preventDefault();addPlayer();}
});

/* --- Старт --- */
function startGame(){
  if(state.players.length < 2){ alert('Трябват поне 2 играча.'); return; }
  state.round = 0;
  state.players.forEach(p=>p.cups=0);
  state.nextDrinkThreshold = randInt(10,15);
  if(state.game==='never'){
    neverShowQuestion();
    go('neverScreen');
  } else {
    state.truth.asker = pick(state.players);
    truthShowPicker();
    go('truthScreen');
  }
}
function quitGame(){
  if(confirm('Сигурен ли си, че искаш да излезеш?')) go('lobbyScreen');
}

/* --- Pool избор на въпрос с фази --- */
function getPool(game, round){
  const q = game==='never' ? NEVER_QUESTIONS : TRUTH_QUESTIONS;
  if(round <= 10) return q.opoznavatelni;
  if(round <= 20) return [...q.opoznavatelni, ...q.lichni];
  return [...q.opoznavatelni, ...q.lichni, ...q.intinni];
}
function pickQuestion(game, round){
  const pool = getPool(game, round);
  const used = state[game].used;
  let available = pool.filter(x=>!used.has(x));
  if(available.length === 0){
    state[game].used = new Set();
    available = pool;
  }
  const q = pick(available);
  state[game].used.add(q);
  return q;
}

/* --- НИКОГА НЕ СЪМ --- */
function neverShowQuestion(){
  state.round++;
  document.getElementById('neverRound').textContent = 'Рунд ' + state.round;
  const q = pickQuestion('never', state.round);
  state.never.currentQ = q;
  state.never.selected = new Set();
  document.getElementById('neverQuestion').textContent = q;
  renderNeverPlayers();
  scheduleDrinkCheck();
}
function renderNeverPlayers(){
  const el = document.getElementById('neverPlayers');
  el.innerHTML = state.players.map(p=>{
    const sel = state.never.selected.has(p.id) ? ' selected' : '';
    return `<button class="player-btn${sel}" onclick="toggleNeverPlayer('${p.id}')">
      <span class="pname">${esc(p.name)}</span>
      <span class="cups">🍺 ${p.cups}</span>
    </button>`;
  }).join('');
}
function toggleNeverPlayer(id){
  if(state.never.selected.has(id)) state.never.selected.delete(id);
  else state.never.selected.add(id);
  vib(8);
  renderNeverPlayers();
}
function neverNext(){
  state.never.selected.forEach(id=>{
    const p = state.players.find(x=>x.id===id);
    if(p) p.cups++;
  });
  vib(15);
  neverShowQuestion();
}

/* --- ИСТИНА ИЛИ НА ЕКС --- */
function truthShowPicker(){
  document.getElementById('truthAskerPicker').style.display = 'block';
  document.getElementById('truthQuestionView').style.display = 'none';
  document.getElementById('truthRound').textContent = 'Рунд ' + state.round;
  document.getElementById('askerName').textContent = state.truth.asker.name;
  const others = state.players.filter(p=>p.id !== state.truth.asker.id);
  document.getElementById('truthPlayers').innerHTML = others.map(p=>
    `<button class="player-btn" onclick="truthAsk('${p.id}')">
      <span class="pname">${esc(p.name)}</span>
      <span class="cups">🍺 ${p.cups}</span>
    </button>`
  ).join('');
}
function truthAsk(targetId){
  state.round++;
  document.getElementById('truthRound').textContent = 'Рунд ' + state.round;
  state.truth.target = state.players.find(p=>p.id===targetId);
  state.truth.currentQ = pickQuestion('truth', state.round);
  state.truth.boost = (Math.random() < 0.075) ? pick(BOOSTS) : null;
  renderTruthQuestion();
  document.getElementById('truthAskerPicker').style.display = 'none';
  document.getElementById('truthQuestionView').style.display = 'block';
  vib(12);
  scheduleDrinkCheck();
}
function renderTruthQuestion(){
  document.getElementById('truthTargetLabel').textContent =
    state.truth.asker.name + ' пита ' + state.truth.target.name + ':';
  document.getElementById('truthQuestion').textContent = state.truth.currentQ;
  const bb = document.getElementById('boostBanner');
  if(state.truth.boost){
    bb.style.display = 'flex';
    bb.innerHTML = `<div class="boost-icon">${state.truth.boost.icon}</div>
      <div><b>БООСТ: ${state.truth.boost.name}</b><span>${state.truth.boost.desc}</span></div>`;
  } else {
    bb.style.display = 'none';
  }
}
function truthNext(){
  state.truth.asker = state.truth.target;
  state.truth.target = null;
  state.truth.currentQ = null;
  state.truth.boost = null;
  truthShowPicker();
  vib(15);
}

/* --- Питие popup --- */
function scheduleDrinkCheck(){
  if(state.round >= state.nextDrinkThreshold){
    state.nextDrinkThreshold = state.round + randInt(10,15);
    setTimeout(()=>{
      document.getElementById('popup').classList.add('active');
      vib(80);
    }, 900);
  }
}
function closePopup(){
  document.getElementById('popup').classList.remove('active');
}
</script>
