const WORLD_SIZE = 6000;

const keys = {};

window.addEventListener('keyup', e => keys[e.code] = false);

const touchControls = { 
  move: { active: false, dx: 0, dy: 0 }, 
  aim: { active: false, dx: 0, dy: 0, angle: 0 } 
};

function setupJoystick(zoneId, knobId, onMove) {
  const zone = document.getElementById(zoneId);
  const knob = document.getElementById(knobId);
  let touchId = null;

  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;
    const touch = e.changedTouches[0];
    touchId = touch.identifier;
    updateKnob(touch);
  });

  window.addEventListener('touchmove', e => {
    if (touchId === null) return;
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) { updateKnob(t); break; }
    }
  });

  const reset = (e) => {
    if (touchId === null) return;
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        knob.style.transform = `translate(-50%, -50%)`;
        onMove(0, 0, 0, false);
        break;
      }
    }
  };

  window.addEventListener('touchend', reset);
  window.addEventListener('touchcancel', reset);

  function updateKnob(touch) {
    const rect = zone.getBoundingClientRect();
    let dx = touch.clientX - (rect.left + rect.width / 2);
    let dy = touch.clientY - (rect.top + rect.height / 2);
    const dist = Math.hypot(dx, dy);
    const maxR = rect.width / 2;

    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    onMove(dx, dy, maxR, true);
  }
}

setupJoystick('move-joystick', 'move-knob', (dx, dy, maxR, active) => {
  touchControls.move.dx = dx / maxR; 
  touchControls.move.dy = dy / maxR; 
  touchControls.move.active = active;
});

setupJoystick('aim-joystick', 'aim-knob', (dx, dy, maxR, active) => {
  if (active && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
    touchControls.aim.angle = Math.atan2(dy, dx);
    touchControls.aim.active = true;
  } else { 
    touchControls.aim.active = false; 
  }
});

const camera = {
  x: 0, y: 0,
  follow(target) {
    const zoom = CAMERA_ZOOM;
    const viewWidth = windowWidth / zoom;
    const viewHeight = windowHeight / zoom;
    this.x = Math.max(0, Math.min(target.x - viewWidth / 2, WORLD_SIZE - viewWidth));
    this.y = Math.max(0, Math.min(target.y - viewHeight / 2, WORLD_SIZE - viewHeight));
  }
};

function isInCenterZone(x, y) {
  const cx = WORLD_SIZE/2;
  const cy = WORLD_SIZE/2;
  return x > cx - CENTER_ZONE_HALF && x < cx + CENTER_ZONE_HALF &&
         y > cy - CENTER_ZONE_HALF && y < cy + CENTER_ZONE_HALF;
}

function canMoveBetweenPoints(fromX, fromY, toX, toY) {
  const cx = WORLD_SIZE/2;
  const cy = WORLD_SIZE/2;
  const half = CENTER_ZONE_HALF;
  
  const fromInside = isInCenterZone(fromX, fromY);
  const toInside = isInCenterZone(toX, toY);
  
  if (fromInside === toInside) return true;
  
  const steps = 20;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = fromX + (toX - fromX) * t;
    const y = fromY + (toY - fromY) * t;
    
    const onTopBoundary = Math.abs(y - (cy - half)) < 5 && x > cx - half && x < cx + half;
    const onBottomBoundary = Math.abs(y - (cy + half)) < 5 && x > cx - half && x < cx + half;
    const onLeftBoundary = Math.abs(x - (cx - half)) < 5 && y > cy - half && y < cy + half;
    const onRightBoundary = Math.abs(x - (cx + half)) < 5 && y > cy - half && y < cy + half;
    
    if (onTopBoundary || onBottomBoundary || onLeftBoundary || onRightBoundary) {
      const atTopEntrance = onTopBoundary && Math.abs(x - cx) < ENTRANCE_WIDTH/2;
      const atBottomEntrance = onBottomBoundary && Math.abs(x - cx) < ENTRANCE_WIDTH/2;
      const atLeftEntrance = onLeftBoundary && Math.abs(y - cy) < ENTRANCE_WIDTH/2;
      const atRightEntrance = onRightBoundary && Math.abs(y - cy) < ENTRANCE_WIDTH/2;
      
      if (atTopEntrance || atBottomEntrance || atLeftEntrance || atRightEntrance) {
        return true;
      } else {
        return false;
      }
    }
  }
  return true;
}

function bulletHitsWall(x, y) {
  const cx = WORLD_SIZE/2;
  const cy = WORLD_SIZE/2;
  const half = CENTER_ZONE_HALF;
  const ew = ENTRANCE_WIDTH / 2;
  
  const onTopWall = Math.abs(y - (cy - half)) < 8 && x > cx - half && x < cx + half;
  const onBottomWall = Math.abs(y - (cy + half)) < 8 && x > cx - half && x < cx + half;
  const onLeftWall = Math.abs(x - (cx - half)) < 8 && y > cy - half && y < cy + half;
  const onRightWall = Math.abs(x - (cx + half)) < 8 && y > cy - half && y < cy + half;
  
  if (onTopWall || onBottomWall || onLeftWall || onRightWall) {
    const atTopEntrance = onTopWall && Math.abs(x - cx) < ew;
    const atBottomEntrance = onBottomWall && Math.abs(x - cx) < ew;
    const atLeftEntrance = onLeftWall && Math.abs(y - cy) < ew;
    const atRightEntrance = onRightWall && Math.abs(y - cy) < ew;
    
    if (atTopEntrance || atBottomEntrance || atLeftEntrance || atRightEntrance) {
      return false;
    }
    return true;
  }
  return false;
}

class Tank {
  constructor(id, x, y, name, color) {
    this.id = id;
    this.x = x;
    this.y = y;
    this.radius = 22;
    this.turretAngle = 0;
    this.speed = 5.0;
    this.name = name;
    this.color = color;
    this.hp = 100;
    this.maxHp = 100;
    this.deaths = myDeaths;
    this.cooldown = 0;
    this.hasRapidFire = false;
    this.rapidFireTimer = 0;
    this.hasShotgun = false;
    this.shotgunTimer = 0;
    this.bulletSize = 1;
    this.bulletDamage = 5;
    this.lastRadDamageTime = 0;
  }

  update() {
    if (this.cooldown > 0) this.cooldown--;
    if (this.rapidFireTimer > 0) {
      this.rapidFireTimer--;
      if (this.rapidFireTimer <= 0) this.hasRapidFire = false;
    }
    if (this.shotgunTimer > 0) {
      this.shotgunTimer--;
      if (this.shotgunTimer <= 0) this.hasShotgun = false;
    }
    
    if (globalEffects.radiation.active) {
      const inCenter = isInCenterZone(this.x, this.y);
      if (!inCenter) {
        const now = Date.now();
        if (now - this.lastRadDamageTime >= 1000) {
          this.hp -= 1;
          this.lastRadDamageTime = now;
          if (this.hp <= 0 && this.id === myPlayerId) {
            handleMyDeath();
          }
        }
      }
    }
  }

  shoot() {
    let reloadTime = this.hasRapidFire ? 5 : 14;
    if (this.cooldown > 0) return;
    this.cooldown = reloadTime;

    const bSpeed = 11;
    const baseDmg = this.hasShotgun ? 3 : this.bulletDamage;
    
    if (this.hasShotgun) {
      for (let i = -2; i <= 2; i++) {
        const angle = this.turretAngle + (i * 0.15);
        const bulletData = {
          id: 'b_' + Math.random().toString(36).substr(2, 7),
          ownerId: this.id,
          x: this.x + Math.cos(this.turretAngle) * (this.radius + 10),
          y: this.y + Math.sin(this.turretAngle) * (this.radius + 10),
          vx: Math.cos(angle) * bSpeed,
          vy: Math.sin(angle) * bSpeed,
          damage: baseDmg,
          size: 4
        };
        window.db.ref('tank_game/bullets/' + bulletData.id).set(bulletData);
      }
    } else {
      const bulletData = {
        id: 'b_' + Math.random().toString(36).substr(2, 7),
        ownerId: this.id,
        x: this.x + Math.cos(this.turretAngle) * (this.radius + 10),
        y: this.y + Math.sin(this.turretAngle) * (this.radius + 10),
        vx: Math.cos(this.turretAngle) * bSpeed,
        vy: Math.sin(this.turretAngle) * bSpeed,
        damage: baseDmg,
        size: this.bulletSize > 1 ? 8 : 5
      };
      window.db.ref('tank_game/bullets/' + bulletData.id).set(bulletData);
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x - camera.x, this.y - camera.y);

    ctx.shadowColor = 'rgba(0,0,0,0.2)';
    ctx.shadowBlur = 10;
    
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.rotate(this.turretAngle);
    ctx.fillStyle = '#475569';
    ctx.fillRect(0, -5, this.radius + 14, 10);
    ctx.fillStyle = '#64748b';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#1e293b';
    ctx.font = '12px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`${this.name} (${this.deaths}💀)`, 0, -this.radius - 12);

    if (this.hp < this.maxHp) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(-20, -this.radius - 8, 40, 4);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(-20, -this.radius - 8, 40 * Math.max(0, (this.hp / this.maxHp)), 4);
    }

    ctx.restore();
  }
}

class BotTank {
  constructor(id, x, y) {
    this.id = id;
    this.x = x;
    this.y = y;
    this.radius = 30;
    this.turretAngle = 0;
    this.speed = 1.5;
    this.hp = 300;
    this.maxHp = 300;
    this.cooldown = 0;
    this.color = '#7c3aed';
    this.moveTimer = 0;
    this.moveDir = 0;
    this.bulletDamage = 8;
    this.lastRadDamageTime = 0;
  }

  update() {
    if (this.cooldown > 0) this.cooldown--;
    
    if (globalEffects.radiation.active) {
      const inCenter = isInCenterZone(this.x, this.y);
      if (!inCenter) {
        const now = Date.now();
        if (now - this.lastRadDamageTime >= 1000) {
          this.hp -= 1;
          this.lastRadDamageTime = now;
          
          if (this.hp <= 0) {
            window.db.ref('tank_game/bots/' + this.id).remove();
          } else {
            window.db.ref('tank_game/bots/' + this.id).update({ hp: this.hp });
          }
        }
      }
    }
    
    let nearest = null;
    let nearestDist = Infinity;
    
    if (localPlayer && localPlayer.hp > 0) {
      const d = Math.hypot(this.x - localPlayer.x, this.y - localPlayer.y);
      if (d < nearestDist) {
        nearestDist = d;
        nearest = localPlayer;
      }
    }
    
    for (let id in networkPlayers) {
      const p = networkPlayers[id];
      if (p.hp > 0) {
        const d = Math.hypot(this.x - p.x, this.y - p.y);
        if (d < nearestDist) {
          nearestDist = d;
          nearest = p;
        }
      }
    }
    
    if (nearest && nearestDist < 500) {
      const angle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
      this.turretAngle = angle;
      
      if (this.cooldown <= 0) {
        this.cooldown = 20;
        const bSpeed = 8;
        const bulletData = {
          id: 'b_' + Math.random().toString(36).substr(2, 7),
          ownerId: this.id,
          x: this.x + Math.cos(angle) * (this.radius + 10),
          y: this.y + Math.sin(angle) * (this.radius + 10),
          vx: Math.cos(angle) * bSpeed,
          vy: Math.sin(angle) * bSpeed,
          damage: this.bulletDamage,
          size: 6,
          isBot: true
        };
        window.db.ref('tank_game/bullets/' + bulletData.id).set(bulletData);
      }
    }
    
    this.moveTimer--;
    if (this.moveTimer <= 0) {
      this.moveDir = rand(0, Math.PI * 2);
      this.moveTimer = rand(60, 180);
    }
    
    const dx = Math.cos(this.moveDir) * this.speed;
    const dy = Math.sin(this.moveDir) * this.speed;
    const nx = this.x + dx;
    const ny = this.y + dy;
    
    if (nx > this.radius && nx < WORLD_SIZE - this.radius &&
        ny > this.radius && ny < WORLD_SIZE - this.radius &&
        !checkObstacleCollision(nx, ny, this.radius)) {
      this.x = nx;
      this.y = ny;
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x - camera.x, this.y - camera.y);
    
    ctx.shadowColor = 'rgba(124, 58, 237, 0.3)';
    ctx.shadowBlur = 20;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#4c1d95';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.rotate(this.turretAngle);
    ctx.fillStyle = '#4c1d95';
    ctx.fillRect(0, -6, this.radius + 16, 12);
    ctx.fillStyle = '#8b5cf6';
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#1e293b';
    ctx.font = '10px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(`🤖 БОС ${Math.floor(this.hp)}HP`, 0, -this.radius - 10);

    if (this.hp < this.maxHp) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(-25, -this.radius - 6, 50, 4);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(-25, -this.radius - 6, 50 * (this.hp / this.maxHp), 4);
    }

    ctx.restore();
  }
}

function setupNetworkListeners() {
  window.db.ref('tank_game/players').on('value', snapshot => {
    const data = snapshot.val() || {};
    networkPlayers = {};
    for (let id in data) {
      if (id !== myPlayerId) networkPlayers[id] = data[id];
    }
  });

  window.db.ref('tank_game/bullets').on('child_added', snapshot => {
    const b = snapshot.val();
    if (b) {
      bullets.push(b);
      window.db.ref('tank_game/bullets/' + snapshot.key).remove();
    }
  });

  window.db.ref('tank_game/gifts').on('value', snapshot => {
    gifts = snapshot.val() || {};
  });

  window.db.ref('tank_game/globalEffects').on('value', snapshot => {
    const data = snapshot.val();
    if (data) {
      globalEffects.fog.active = data.fogActive || false;
      globalEffects.radiation.active = data.radActive || false;
    } else {
      globalEffects.fog.active = false;
      globalEffects.radiation.active = false;
    }
  });

  window.db.ref('tank_game/bots').on('value', snapshot => {
    const data = snapshot.val() || {};
    const newBots = {};
    for (let id in data) {
      const bData = data[id];
      if (botTanks[id]) {
        botTanks[id].hp = bData.hp;
        if (Math.hypot(botTanks[id].x - bData.x, botTanks[id].y - bData.y) > 100) {
          botTanks[id].x = bData.x;
          botTanks[id].y = bData.y;
        }
        botTanks[id].turretAngle = bData.turretAngle || 0;
        newBots[id] = botTanks[id];
      } else {
        const bot = new BotTank(id, bData.x, bData.y);
        bot.hp = bData.hp || 300;
        newBots[id] = bot;
      }
    }
    botTanks = newBots;
  });
}

function syncMyPlayer() {
  if (!localPlayer) return;
  window.db.ref('tank_game/players/' + myPlayerId).set({
    id: localPlayer.id,
    x: localPlayer.x,
    y: localPlayer.y,
    turretAngle: localPlayer.turretAngle,
    name: localPlayer.name,
    hp: localPlayer.hp,
    deaths: myDeaths,
    color: localPlayer.color,
    lastSeen: Date.now()
  });
}

function checkObstacleCollision(nx, ny, radius) {
  for (let obs of obstacles) {
    let closestX = Math.max(obs.x, Math.min(nx, obs.x + obs.w));
    let closestY = Math.max(obs.y, Math.min(ny, obs.y + obs.h));
    let dist = Math.hypot(nx - closestX, ny - closestY);
    if (dist < radius) return true;
  }
  return false;
}

function handlePlayerInput() {
  if (!localPlayer || localPlayer.hp <= 0) return;

  let moveX = 0, moveY = 0;
  if (keys['KeyW']) moveY -= 1;
  if (keys['KeyS']) moveY += 1;
  if (keys['KeyA']) moveX -= 1;
  if (keys['KeyD']) moveX += 1;

  if (touchControls.move.active) {
    moveX = touchControls.move.dx;
    moveY = touchControls.move.dy;
  }

  if (moveX !== 0 || moveY !== 0) {
    const len = Math.hypot(moveX, moveY);
    let nextX = localPlayer.x + (moveX / (len > 1 ? len : 1)) * localPlayer.speed;
    let nextY = localPlayer.y + (moveY / (len > 1 ? len : 1)) * localPlayer.speed;

    nextX = Math.max(localPlayer.radius, Math.min(WORLD_SIZE - localPlayer.radius, nextX));
    nextY = Math.max(localPlayer.radius, Math.min(WORLD_SIZE - localPlayer.radius, nextY));

    if (!canMoveBetweenPoints(localPlayer.x, localPlayer.y, nextX, nextY)) {
      if (canMoveBetweenPoints(localPlayer.x, localPlayer.y, nextX, localPlayer.y)) {
        nextY = localPlayer.y;
      } else if (canMoveBetweenPoints(localPlayer.x, localPlayer.y, localPlayer.x, nextY)) {
        nextX = localPlayer.x;
      } else {
        nextX = localPlayer.x;
        nextY = localPlayer.y;
      }
    }

    if (!checkObstacleCollision(nextX, nextY, localPlayer.radius)) {
      localPlayer.x = nextX;
      localPlayer.y = nextY;
    }
  }

  let aimX = 0, aimY = 0;
  if (keys['ArrowUp']) aimY -= 1;
  if (keys['ArrowDown']) aimY += 1;
  if (keys['ArrowLeft']) aimX -= 1;
  if (keys['ArrowRight']) aimX += 1;

  if (aimX !== 0 || aimY !== 0) {
    localPlayer.turretAngle = Math.atan2(aimY, aimX);
    localPlayer.shoot();
  } else if (touchControls.aim.active) {
    localPlayer.turretAngle = touchControls.aim.angle;
    localPlayer.shoot();
  }

  if (keys['Space']) {
    localPlayer.shoot();
  }

  for (let trap of traps) {
    let d = Math.hypot(localPlayer.x - trap.x, localPlayer.y - trap.y);
    if (d < localPlayer.radius + trap.radius) {
      localPlayer.hp -= 0.5;
      if (localPlayer.hp <= 0) {
        handleMyDeath();
        return;
      }
    }
  }

  for (let gId in gifts) {
    let g = gifts[gId];
    let d = Math.hypot(localPlayer.x - g.x, localPlayer.y - g.y);
    if (d < localPlayer.radius + 20) {
      applyGiftEffect(g.type);
      window.db.ref('tank_game/gifts/' + gId).remove();
    }
  }

  localPlayer.update();
  camera.follow(localPlayer);
  syncMyPlayer();
}

function showEffectIndicator(text, duration) {
  const el = document.getElementById('effect-indicator');
  el.textContent = text;
  el.style.display = 'block';
  clearTimeout(effectTimeout);
  effectTimeout = setTimeout(() => {
    el.style.display = 'none';
  }, duration);
}

function applyGiftEffect(type) {
  if (!localPlayer) return;
  
  switch(type) {
    case 'hp':
      localPlayer.hp = Math.min(localPlayer.maxHp, localPlayer.hp + 5);
      showEffectIndicator('❤️ +5 HP', 2000);
      break;
    case 'rapid':
      localPlayer.hasRapidFire = true;
      localPlayer.rapidFireTimer = 300;
      showEffectIndicator('⚡ Бърза стрелба! (5сек)', 3000);
      break;
    case 'shotgun':
      localPlayer.hasShotgun = true;
      localPlayer.shotgunTimer = 300;
      showEffectIndicator('🔫 Шотгън! (5сек)', 3000);
      break;
    case 'bigbullet':
      localPlayer.bulletSize = 2;
      localPlayer.bulletDamage = 10;
      setTimeout(() => {
        localPlayer.bulletSize = 1;
        localPlayer.bulletDamage = 5;
      }, 5000);
      showEffectIndicator('💥 Големи патрони! (5сек)', 3000);
      break;
    case 'fog':
      window.db.ref('tank_game/globalEffects').update({
        fogActive: true
      });
      showEffectIndicator('🌫️ МЪГЛА ЗА ВСИЧКИ! (10сек)', 3000);
      
      setTimeout(() => {
        window.db.ref('tank_game/globalEffects').update({
          fogActive: false
        });
      }, 10000);
      break;

    case 'radiation':
      window.db.ref('tank_game/globalEffects').update({
        radActive: true
      });
      showEffectIndicator('☢️ РАДИАЦИЯ ЗА ВСИЧКИ! (100сек)', 3000);
      
      setTimeout(() => {
        window.db.ref('tank_game/globalEffects').update({
          radActive: false
        });
      }, 100000);
      break;
    case 'bot':
      let botX, botY, attempts = 0;
      do {
        botX = rand(200, WORLD_SIZE - 200);
        botY = rand(200, WORLD_SIZE - 200);
        attempts++;
      } while (isInCenterZone(botX, botY) && attempts < 50);

      const botId = 'bot_' + Math.random().toString(36).substr(2, 7);
      window.db.ref('tank_game/bots/' + botId).set({
        x: botX,
        y: botY,
        hp: 300,
        turretAngle: 0
      });
      showEffectIndicator('🤖 БОС СПАУНВАН!', 3000);
      break;
  }
}

function handleMyDeath() {
  myDeaths++;
  
  const giftTypes = ['hp', 'hp', 'hp', 'rapid', 'shotgun', 'bigbullet', 'fog', 'radiation', 'bot'];
  const giftType = giftTypes[Math.floor(Math.random() * giftTypes.length)];
  
  const giftId = 'gift_' + Math.random().toString(36).substr(2, 7);
  const giftData = {
    x: localPlayer.x,
    y: localPlayer.y,
    type: giftType
  };
  window.db.ref('tank_game/gifts/' + giftId).set(giftData);
  setTimeout(() => {
    window.db.ref('tank_game/gifts/' + giftId).remove();
  }, 3000);

  triggerRespawn();
}

function gameLoop() {
  ctx.fillStyle = '#d4dce8';
  ctx.fillRect(0, 0, windowWidth, windowHeight);

  handlePlayerInput();

  ctx.save();
  ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);

  // Grid
  ctx.strokeStyle = 'rgba(30, 41, 59, 0.08)';
  ctx.lineWidth = 1;
  const gridSize = 80;
  const startX = Math.floor(camera.x / gridSize) * gridSize;
  const startY = Math.floor(camera.y / gridSize) * gridSize;

  for (let x = startX; x < startX + windowWidth / CAMERA_ZOOM + gridSize; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x - camera.x, 0); ctx.lineTo(x - camera.x, windowHeight / CAMERA_ZOOM); ctx.stroke();
  }
  for (let y = startY; y < startY + windowHeight / CAMERA_ZOOM + gridSize; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y - camera.y); ctx.lineTo(windowWidth / CAMERA_ZOOM, y - camera.y); ctx.stroke();
  }

  // World border
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 4;
  ctx.strokeRect(-camera.x, -camera.y, WORLD_SIZE, WORLD_SIZE);

  // GLOBAL FOG
  if (globalEffects.fog.active) {
    const fogIntensity = 0.97;
    const gradient = ctx.createRadialGradient(
      localPlayer ? localPlayer.x - camera.x : windowWidth/2 / CAMERA_ZOOM,
      localPlayer ? localPlayer.y - camera.y : windowHeight/2 / CAMERA_ZOOM,
      15,
      localPlayer ? localPlayer.x - camera.x : windowWidth/2 / CAMERA_ZOOM,
      localPlayer ? localPlayer.y - camera.y : windowHeight/2 / CAMERA_ZOOM,
      Math.max(windowWidth, windowHeight) * 0.9 / CAMERA_ZOOM
    );
    gradient.addColorStop(0, `rgba(0, 0, 0, 0.05)`);
    gradient.addColorStop(0.15, `rgba(0, 0, 0, 0.6)`);
    gradient.addColorStop(0.4, `rgba(0, 0, 0, ${fogIntensity * 0.9})`);
    gradient.addColorStop(1, `rgba(0, 0, 0, ${fogIntensity})`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, windowWidth / CAMERA_ZOOM, windowHeight / CAMERA_ZOOM);
  }

  // Draw center zone with physical walls
  const cx = WORLD_SIZE/2 - camera.x;
  const cy = WORLD_SIZE/2 - camera.y;
  const half = CENTER_ZONE_HALF;
  const ew = ENTRANCE_WIDTH / 2;
  
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.fillRect(cx - half, cy - half, CENTER_ZONE_SIZE, CENTER_ZONE_SIZE);
  
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#475569';
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  
  ctx.fillRect(cx - half, cy - half - 4, half - ew, 12);
  ctx.fillRect(cx + ew, cy - half - 4, half - ew, 12);
  ctx.fillRect(cx - half, cy + half - 8, half - ew, 12);
  ctx.fillRect(cx + ew, cy + half - 8, half - ew, 12);
  ctx.fillRect(cx - half - 4, cy - half, 12, half - ew);
  ctx.fillRect(cx - half - 4, cy + ew, 12, half - ew);
  ctx.fillRect(cx + half - 8, cy - half, 12, half - ew);
  ctx.fillRect(cx + half - 8, cy + ew, 12, half - ew);
  ctx.shadowBlur = 0;

  // GLOBAL RADIATION warning
  if (globalEffects.radiation.active) {
    const pulse = Math.sin(Date.now() / 500) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(236, 72, 153, ${0.06 * pulse})`;
    ctx.fillRect(0, 0, windowWidth / CAMERA_ZOOM, windowHeight / CAMERA_ZOOM);
    
    ctx.strokeStyle = `rgba(34, 197, 94, ${0.6 * pulse})`;
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 10]);
    ctx.strokeRect(cx - half, cy - half, CENTER_ZONE_SIZE, CENTER_ZONE_SIZE);
    ctx.setLineDash([]);
    
    ctx.fillStyle = `rgba(34, 197, 94, ${0.7 * pulse})`;
    ctx.font = 'bold 16px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('🛡️ БЕЗОПАСНА ЗОНА', cx, cy - half - 30);
    
    ctx.fillStyle = `rgba(236, 72, 153, ${0.7 * pulse})`;
    ctx.font = 'bold 14px Segoe UI';
    ctx.fillText('☢️ РАДИАЦИЯ ИЗВЪН ЗОНАТА!', windowWidth/2 / CAMERA_ZOOM, 30);
  }

  // Draw obstacles
  ctx.fillStyle = '#94a3b8';
  ctx.strokeStyle = '#64748b';
  ctx.lineWidth = 2;
  obstacles.forEach(obs => {
    ctx.fillRect(obs.x - camera.x, obs.y - camera.y, obs.w, obs.h);
    ctx.strokeRect(obs.x - camera.x, obs.y - camera.y, obs.w, obs.h);
  });

  // Draw traps
  const pulseTrap = Math.sin(Date.now() / 500) * 0.3 + 0.7;
  traps.forEach(trap => {
    ctx.fillStyle = `rgba(220, 38, 38, ${0.15 * pulseTrap})`;
    ctx.beginPath();
    ctx.arc(trap.x - camera.x, trap.y - camera.y, trap.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(220, 38, 38, ${0.3 * pulseTrap})`;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Draw gifts
  for (let gId in gifts) {
    let g = gifts[gId];
    ctx.save();
    ctx.translate(g.x - camera.x, g.y - camera.y);
    
    const colors = {
      'hp': '#22c55e',
      'rapid': '#f59e0b',
      'shotgun': '#ef4444',
      'bigbullet': '#8b5cf6',
      'fog': '#6366f1',
      'radiation': '#ec4899',
      'bot': '#7c3aed'
    };
    
    ctx.fillStyle = colors[g.type] || '#22c55e';
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    const icons = {
      'hp': '❤️',
      'rapid': '⚡',
      'shotgun': '🔫',
      'bigbullet': '💥',
      'fog': '🌫️',
      'radiation': '☢️',
      'bot': '🤖'
    };
    ctx.fillText(icons[g.type] || '🎁', 0, 4);
    ctx.restore();
  }

  // Draw bot tanks
  for (let id in botTanks) {
    const bot = botTanks[id];
    bot.update();
    bot.draw(ctx);
  }

  // Draw local player
  if (localPlayer && localPlayer.hp > 0) localPlayer.draw(ctx);

  // Draw network players
  const now = Date.now();
  for (let id in networkPlayers) {
    const p = networkPlayers[id];
    if (!p.lastSeen || (now - p.lastSeen > 5000)) {
      delete networkPlayers[id];
      window.db.ref('tank_game/players/' + id).remove();
      continue;
    }

    if (p.hp > 0) {
      const remoteTank = new Tank(p.id, p.x, p.y, p.name, p.color || '#ef4444');
      remoteTank.turretAngle = p.turretAngle;
      remoteTank.hp = p.hp;
      remoteTank.deaths = p.deaths || 0;
      remoteTank.draw(ctx);
    }
  }

  // Handle bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;

    if (bulletHitsWall(b.x, b.y)) {
      bullets.splice(i, 1);
      continue;
    }

    let hitObs = obstacles.some(obs => b.x >= obs.x && b.x <= obs.x + obs.w && b.y >= obs.y && b.y <= obs.y + obs.h);
    if (hitObs) {
      bullets.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.translate(b.x - camera.x, b.y - camera.y);
    ctx.fillStyle = b.isBot ? '#7c3aed' : '#f59e0b';
    ctx.shadowColor = 'rgba(245, 158, 11, 0.3)';
    ctx.shadowBlur = 10;
    const size = b.size || 5;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Check hits on local player
    if (localPlayer && b.ownerId !== localPlayer.id && localPlayer.hp > 0) {
      const dist = Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y);
      if (dist < localPlayer.radius + (b.size || 5)) {
        localPlayer.hp -= b.damage || 5;
        bullets.splice(i, 1);
        
        if (localPlayer.hp <= 0) {
          handleMyDeath();
        }
        continue;
      }
    }

    // Check hits on bot tanks
    for (let id in botTanks) {
      const bot = botTanks[id];
      if (b.ownerId !== id && bot.hp > 0) {
        const dist = Math.hypot(b.x - bot.x, b.y - bot.y);
        if (dist < bot.radius + (b.size || 5)) {
          bot.hp -= b.damage || 5;
          bullets.splice(i, 1);
          if (bot.hp <= 0) {
            window.db.ref('tank_game/bots/' + id).remove();
          } else {
            window.db.ref('tank_game/bots/' + id).update({ hp: bot.hp });
          }
          break;
        }
      }
    }

    // Check hits on network players
    for (let id in networkPlayers) {
      const p = networkPlayers[id];
      if (b.ownerId !== id && p.hp > 0) {
        const dist = Math.hypot(b.x - p.x, b.y - p.y);
        if (dist < 22 + (b.size || 5)) {
          p.hp -= b.damage || 5;
          bullets.splice(i, 1);
          if (p.hp <= 0) {
            delete networkPlayers[id];
            window.db.ref('tank_game/players/' + id).remove();
          }
          break;
        }
      }
    }

    if (b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE) {
      bullets.splice(i, 1);
    }
  }

  ctx.restore();

  updateHUD();
  drawMinimap();

  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  if (localPlayer) {
    document.getElementById('hp-fill').style.width = Math.max(0, (localPlayer.hp / localPlayer.maxHp) * 100) + '%';
  }

  const allList = [];
  if (localPlayer) allList.push({ id: myPlayerId, name: localPlayer.name, deaths: myDeaths });
  for (let id in networkPlayers) {
    allList.push({ id: id, name: networkPlayers[id].name, deaths: networkPlayers[id].deaths || 0 });
  }

  const sorted = allList.sort((a, b) => a.deaths - b.deaths).slice(0, 5);
  const lbContainer = document.getElementById('lb-list');
  lbContainer.innerHTML = '';

  sorted.forEach((t, idx) => {
    const row = document.createElement('div');
    row.className = `lb-row ${t.id === myPlayerId ? 'me' : ''}`;
    row.innerHTML = `<span>#${idx+1} ${t.name}</span><span>${t.deaths} 💀</span>`;
    lbContainer.appendChild(row);
  });
}

function drawMinimap() {
  mmCtx.clearRect(0, 0, 60, 60);
  mmCtx.fillStyle = '#f1f5f9';
  mmCtx.fillRect(0, 0, 60, 60);
  
  const scale = 60 / WORLD_SIZE;

  if (globalEffects.radiation.active) {
    mmCtx.fillStyle = 'rgba(236, 72, 153, 0.15)';
    mmCtx.fillRect(0, 0, 60, 60);
  }

  mmCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  const cz = CENTER_ZONE_SIZE * scale;
  const cx = (WORLD_SIZE/2 - CENTER_ZONE_HALF) * scale;
  const cy = (WORLD_SIZE/2 - CENTER_ZONE_HALF) * scale;
  mmCtx.fillRect(cx, cy, cz, cz);
  mmCtx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
  mmCtx.lineWidth = 2;
  mmCtx.strokeRect(cx, cy, cz, cz);

  mmCtx.fillStyle = '#94a3b8';
  obstacles.forEach(obs => {
    mmCtx.fillRect(obs.x * scale, obs.y * scale, obs.w * scale, obs.h * scale);
  });

  mmCtx.fillStyle = 'rgba(220, 38, 38, 0.3)';
  traps.forEach(trap => {
    mmCtx.beginPath();
    mmCtx.arc(trap.x * scale, trap.y * scale, trap.radius * scale, 0, Math.PI * 2);
    mmCtx.fill();
  });

  if (localPlayer) {
    mmCtx.fillStyle = '#2563eb';
    mmCtx.beginPath(); mmCtx.arc(localPlayer.x * scale, localPlayer.y * scale, 3, 0, Math.PI * 2); mmCtx.fill();
  }

  for (let id in networkPlayers) {
    const p = networkPlayers[id];
    if (p.hp > 0) {
      mmCtx.fillStyle = '#ef4444';
      mmCtx.beginPath(); mmCtx.arc(p.x * scale, p.y * scale, 2, 0, Math.PI * 2); mmCtx.fill();
    }
  }

  for (let id in botTanks) {
    const bot = botTanks[id];
    if (bot.hp > 0) {
      mmCtx.fillStyle = '#7c3aed';
      mmCtx.beginPath(); mmCtx.arc(bot.x * scale, bot.y * scale, 2.5, 0, Math.PI * 2); mmCtx.fill();
    }
  }
}

function joinGame() {
  const name = document.getElementById('player-name').value.trim() || "Танкист";
  document.getElementById('start-overlay').classList.add('hidden');
  
  const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
  localPlayer = new Tank(myPlayerId, rand(200, WORLD_SIZE - 200), rand(200, WORLD_SIZE - 200), name, randomColor);

  window.db.ref('tank_game/players/' + myPlayerId).onDisconnect().remove();

  setupNetworkListeners();

  if (!isPlaying) {
    isPlaying = true;
    gameLoop();
  }
}

function triggerRespawn() {
  window.db.ref('tank_game/players/' + myPlayerId).remove();
  document.getElementById('respawn-overlay').classList.remove('hidden');
  let count = 3;
  document.getElementById('respawn-count').textContent = count;

  const timer = setInterval(() => {
    count--;
    if (count > 0) {
      document.getElementById('respawn-count').textContent = count;
    } else {
      clearInterval(timer);
      document.getElementById('respawn-overlay').classList.add('hidden');
      joinGame();
    }
  }, 1000);
}

function exitGame() {
  if (myPlayerId) {
    window.db.ref('tank_game/players/' + myPlayerId).remove();
  }
  window.location.href = 'index.html';
}
